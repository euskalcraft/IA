<script>
"use strict";
/* ==================================================================
   NOCHE DE TUMBAS — plataformas de acción estilo arcade clásico
   (homenaje a los arcades de caballeros, zombis y demonios de los 80)
   Canvas 2D a 320x192 escalado en píxel + WebAudio. Un solo archivo.
   ================================================================== */

const VW = 320, VH = 192, TS = 16, COLS = 206, ROWS = 12, GROUND_Y = 160;
const ARENA0 = 176 * TS, ARENA1 = 196 * TS;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = VW; buf.height = VH;
const b = buf.getContext('2d');
const FONT = '"Press Start 2P","Courier New",monospace';

const rand = (a, c) => a + Math.random() * (c - a);
const clamp = (v, a, c) => v < a ? a : v > c ? c : v;
const overlap = (a, c) => a.x < c.x + c.w && a.x + a.w > c.x && a.y < c.y + c.h && a.y + a.h > c.y;
function R(x, y, w, h, c) { b.fillStyle = c; b.fillRect(Math.round(x), Math.round(y), w, h); }
// Dibuja piezas relativas a (pies, centro) y las refleja según hacia dónde mira
const qf = (cx, fy, f) => (dx, dy, w, h, c) => R(f > 0 ? cx + dx : cx - dx - w, fy + dy, w, h, c);

// ------------------------------------------------------------------
// Pantalla
// ------------------------------------------------------------------
let W = 0, H = 0, S = 1, OX = 0, OY = 0, isTouch = false;
function resize() {
  W = innerWidth; H = innerHeight;
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  let s = Math.min(W / VW, H / VH); if (s >= 2) s = Math.floor(s);
  S = s; OX = Math.floor((W - VW * S) / 2); OY = Math.floor((H - VH * S) / 2);
}
addEventListener('resize', resize);

// ------------------------------------------------------------------
// Audio (sintetizado) + música
// ------------------------------------------------------------------
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type = 'square', vol = .06, slide = 0, at = 0) {
  if (muted || !actx) return;
  const n = (at || actx.currentTime), o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(actx.destination); o.start(n); o.stop(n + d + .02);
}
function noiseB(d, vol = .2, cut = 1500) {
  if (muted || !actx) return;
  const n = actx.currentTime, len = Math.floor(actx.sampleRate * d);
  const bf = actx.createBuffer(1, len, actx.sampleRate), data = bf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), g = actx.createGain(), fl = actx.createBiquadFilter();
  s.buffer = bf; g.gain.value = vol; fl.type = 'lowpass'; fl.frequency.value = cut;
  s.connect(fl).connect(g).connect(actx.destination); s.start(n);
}
const seq = (notes, gap, type = 'square', vol = .06, len = .15) =>
  notes.forEach((f, i) => setTimeout(() => tone(f, len, type, vol), i * gap));
const sfx = {
  jump()    { tone(260, .12, 'square', .04, 320); },
  throw()   { noiseB(.06, .08, 3500); tone(700, .05, 'square', .025, -300); },
  hit()     { tone(180, .06, 'square', .05, -80); },
  kill()    { noiseB(.25, .16, 1500); tone(420, .15, 'square', .04, -320); },
  armor()   { noiseB(.35, .25, 4000); tone(520, .35, 'sawtooth', .07, -380); },
  die()     { seq([392, 370, 349, 330, 311, 294, 277, 262], 110, 'square', .06); },
  item()    { seq([660, 880, 1100, 1320], 55, 'square', .045, .09); },
  chest()   { noiseB(.2, .2, 1200); tone(220, .2, 'triangle', .1, 200); },
  roar()    { noiseB(1, .3, 600); tone(90, 1, 'sawtooth', .11, -40); },
  thud()    { noiseB(.35, .35, 400); tone(70, .3, 'sine', .25, -30); },
  splash()  { noiseB(.5, .25, 2500); },
  caw()     { tone(900, .12, 'sawtooth', .035, -500); setTimeout(() => tone(850, .12, 'sawtooth', .035, -500), 140); },
  fire()    { noiseB(.45, .12, 900); },
  fireball(){ tone(200, .25, 'sawtooth', .04, 300); },
  fanfare() { seq([523, 659, 784, 1046, 784, 1046, 1318], 140, 'square', .06, .2); },
  check()   { seq([523, 784, 1046], 90, 'triangle', .08, .15); }
};
// Música original en re menor (marcha tétrica de 4 compases)
const MEL = [62,65,69,65, 62,65,69,72, 70,69,67,65, 64,65,67,0,
             62,65,69,65, 62,65,69,74, 73,74,76,73, 74,0,62,0];
const BASS = [38,38,45,45, 46,46,40,45, 38,38,45,45, 45,45,38,38];
let seqStep = 0, nextNoteT = 0;
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function schedule() {
  if (!actx) return;
  const playing = state === 'play' && !paused && player && !player.dead && !muted;
  if (!playing) { nextNoteT = actx.currentTime + .05; return; }
  const step = 60 / (bossActive ? 178 : 148) / 2;
  while (nextNoteT < actx.currentTime + .15) {
    const i = seqStep % 32, m = MEL[i];
    const tr = bossActive ? -2 : 0;
    if (m) tone(midi(m + tr), step * .85, 'square', .028, 0, nextNoteT);
    if (i % 2 === 0) tone(midi(BASS[i / 2] + tr), step * 1.7, 'triangle', .085, 0, nextNoteT);
    seqStep++; nextNoteT += step;
  }
}
setInterval(schedule, 40);

// ------------------------------------------------------------------
// Entrada: teclado + táctil
// ------------------------------------------------------------------
const KB = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down', KeyZ: 'jump', Space: 'jump', KeyK: 'jump', KeyX: 'fire', KeyJ: 'fire',
  ControlLeft: 'fire', ControlRight: 'fire', Enter: 'start', KeyP: 'pause', Escape: 'pause' };
const kb = {}, tc = {}, press = {};
const held = a => kb[a] || tc[a];
addEventListener('keydown', e => {
  audio();
  if (e.code === 'KeyM') { if (!e.repeat) muted = !muted; return; }
  const a = KB[e.code]; if (!a) return;
  e.preventDefault();
  if (!kb[a]) press[a] = true;
  kb[a] = true;
});
addEventListener('keyup', e => { const a = KB[e.code]; if (a) kb[a] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; if (state === 'play') paused = true; });

const touches = new Map();
function touchAction(x, y) {
  const dx = x - 95, dy = y - (H - 95);
  if (Math.hypot(dx, dy) < 80) return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
  if (Math.hypot(x - (W - 65), y - (H - 110)) < 45) return 'jump';
  if (Math.hypot(x - (W - 150), y - (H - 65)) < 45) return 'fire';
  return null;
}
function refreshTouch() {
  for (const k of ['left', 'right', 'up', 'down', 'jump', 'fire']) tc[k] = false;
  for (const a of touches.values()) if (a) tc[a] = true;
}
cv.addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'touch') isTouch = true;
  if (state !== 'play') { press.tap = true; return; }
  if (Math.hypot(e.clientX - (W - 30), e.clientY - 30) < 30) { press.pause = true; return; }
  if (paused) { press.pause = true; return; }
  if (e.pointerType !== 'touch') { press.fire = true; return; }
  const a = touchAction(e.clientX, e.clientY);
  if (a && !tc[a]) press[a] = true;
  touches.set(e.pointerId, a); refreshTouch();
});
cv.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  const a = touchAction(e.clientX, e.clientY);
  if (a && !tc[a] && touches.get(e.pointerId) !== a) press[a] = true;
  touches.set(e.pointerId, a); refreshTouch();
});
const endTouch = e => { touches.delete(e.pointerId); refreshTouch(); };
addEventListener('pointerup', endTouch); addEventListener('pointercancel', endTouch);

// ------------------------------------------------------------------
// Nivel
// ------------------------------------------------------------------
// 0 vacío · 1 tierra/sólido · 2 cornisa (atravesable desde abajo) · 3 escalera · 4 agua · 5 lápida (sólida)
const tiles = new Uint8Array(COLS * ROWS);
const get = (c, r) => (c < 0 || c >= COLS) ? 1 : (r < 0 || r >= ROWS) ? 0 : tiles[r * COLS + c];
const set = (c, r, v) => { if (c >= 0 && c < COLS && r >= 0 && r < ROWS) tiles[r * COLS + c] = v; };
const isSolid = t => t === 1 || t === 5;
function box(c0, c1, r0, r1, v) { for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) set(c, r, v); }
function buildLevel() {
  tiles.fill(0);
  box(0, COLS - 1, 10, 11, 1);
  // 1 · Cementerio
  [8, 14, 21, 27, 34, 41, 47].forEach(c => set(c, 9, 5));
  box(51, 56, 8, 9, 1);
  // 2 · Colina con escalera
  box(60, 88, 5, 9, 1); box(59, 59, 5, 9, 3);
  [66, 75, 83].forEach(c => set(c, 4, 5));
  box(69, 72, 2, 2, 2);
  // 3 · Bosque y río
  box(96, 125, 10, 11, 4); box(104, 106, 10, 11, 1); box(115, 117, 10, 11, 1);
  // 4 · Cementerio profundo
  [132, 138, 147, 161, 168].forEach(c => set(c, 9, 5));
  box(141, 145, 7, 7, 2); box(152, 156, 7, 7, 2); box(151, 151, 7, 9, 3);
  // 5 · Muralla del castillo (puerta)
  box(196, COLS - 1, 0, 9, 1);
}
const zoneOf = c => c < 58 ? 'grave' : c < 89 ? 'hill' : c < 127 ? 'forest' : c < 176 ? 'grave2' : 'arena';
const themeOf = c => c >= 176 ? 'castle' : (c >= 89 && c < 127) ? 'forest' : 'grave';
const DECO = [
  { t: 'dead', c: 4 }, { t: 'dead', c: 25 }, { t: 'dead', c: 44 }, { t: 'cross', c: 11 }, { t: 'cross', c: 31 },
  { t: 'cross', c: 37 }, { t: 'dead', c: 64 }, { t: 'cross', c: 79 }, { t: 'tree', c: 90 }, { t: 'tree', c: 98 },
  { t: 'tree', c: 108 }, { t: 'tree', c: 119 }, { t: 'tree', c: 126 }, { t: 'dead', c: 135 }, { t: 'cross', c: 144 },
  { t: 'dead', c: 158 }, { t: 'cross', c: 165 }, { t: 'torch', c: 178 }, { t: 'torch', c: 193 }
];

// ------------------------------------------------------------------
// Gráficos precalculados (tiles y fondos)
// ------------------------------------------------------------------
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; }
let seed = 1; const srand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const THEMES = {
  grave:  { dirt: '#3b2a24', dirt2: '#2a1d19', stone: '#5a4a44', grass: '#2e5a3e', grass2: '#4c8a5a' },
  forest: { dirt: '#4a3020', dirt2: '#33200f', stone: '#6a5040', grass: '#3f8a2e', grass2: '#7cc04a' },
  castle: { dirt: '#3a3848', dirt2: '#25232f', stone: '#5c5a70', grass: '#4a4860', grass2: '#6e6c88' }
};
function groundTile(th, top, sd) {
  return mk(TS, TS, g => {
    seed = sd; g.fillStyle = th.dirt; g.fillRect(0, 0, 16, 16);
    for (let i = 0; i < 16; i++) { g.fillStyle = srand() < .5 ? th.dirt2 : th.stone; g.fillRect(Math.floor(srand() * 15), Math.floor(srand() * 15), srand() < .3 ? 2 : 1, 1); }
    if (top) {
      for (let x = 0; x < 16; x++) { const h = 3 + ((x * 5) % 4 === 0 ? 2 : (x % 3 === 0 ? 1 : 0)); g.fillStyle = th.grass; g.fillRect(x, 0, 1, h); }
      g.fillStyle = th.grass2; for (let x = 0; x < 16; x += 3) g.fillRect(x, 0, 1, 1); g.fillRect(5, 1, 1, 1); g.fillRect(11, 1, 1, 1);
    }
  });
}
function brickTile(th, top) {
  return mk(TS, TS, g => {
    g.fillStyle = th.dirt; g.fillRect(0, 0, 16, 16); g.fillStyle = th.dirt2;
    for (let y = 0; y < 16; y += 4) { g.fillRect(0, y, 16, 1); const off = (y / 4) % 2 ? 4 : 12; g.fillRect(off, y, 1, 4); g.fillRect((off + 8) % 16, y, 1, 4); }
    g.fillStyle = th.stone; g.fillRect(1, 1, 3, 1); g.fillRect(9, 5, 3, 1); g.fillRect(4, 9, 3, 1); g.fillRect(12, 13, 3, 1);
    if (top) { g.fillStyle = th.grass2; g.fillRect(0, 0, 16, 2); }
  });
}
const TILES = {};
for (const k in THEMES) {
  const th = THEMES[k];
  TILES[k] = k === 'castle'
    ? { top: brickTile(th, true), inner: brickTile(th, false), inner2: brickTile(th, false) }
    : { top: groundTile(th, true, 7), inner: groundTile(th, false, 13), inner2: groundTile(th, false, 29) };
}
const tombTile = mk(TS, TS, g => {
  g.fillStyle = '#24222e'; g.fillRect(2, 3, 12, 13); g.fillRect(3, 2, 10, 1); g.fillRect(4, 1, 8, 1);
  g.fillStyle = '#8e8c9e'; g.fillRect(3, 3, 10, 13); g.fillRect(4, 2, 8, 1);
  g.fillStyle = '#b4b2c4'; g.fillRect(3, 3, 2, 12);
  g.fillStyle = '#5e5c70'; g.fillRect(7, 5, 2, 7); g.fillRect(5, 7, 6, 2);
  g.fillStyle = '#4a6a3a'; g.fillRect(2, 14, 3, 2); g.fillRect(11, 15, 3, 1);
});
const ledgeTile = mk(TS, TS, g => {
  g.fillStyle = '#2b2a36'; g.fillRect(0, 0, 16, 7);
  g.fillStyle = '#77778c'; g.fillRect(0, 0, 16, 5); g.fillStyle = '#9a9ab0'; g.fillRect(0, 0, 16, 1);
  g.fillStyle = '#4e4e62'; g.fillRect(5, 1, 1, 4); g.fillRect(12, 1, 1, 4);
});
const ladderTile = mk(TS, TS, g => {
  g.fillStyle = '#5a3a1a'; g.fillRect(2, 0, 2, 16); g.fillRect(12, 0, 2, 16);
  g.fillStyle = '#8a5a2a'; g.fillRect(2, 0, 1, 16); g.fillRect(12, 0, 1, 16);
  for (let y = 2; y < 16; y += 5) { g.fillStyle = '#8a5a2a'; g.fillRect(4, y, 8, 2); g.fillStyle = '#5a3a1a'; g.fillRect(4, y + 1, 8, 1); }
});
const sky = mk(VW, VH, g => {
  const gr = g.createLinearGradient(0, 0, 0, VH);
  gr.addColorStop(0, '#090820'); gr.addColorStop(.55, '#2a1640'); gr.addColorStop(1, '#5a2848');
  g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
  seed = 99;
  for (let i = 0; i < 60; i++) { g.fillStyle = srand() < .3 ? '#ffffff' : '#8a86b0'; g.fillRect(Math.floor(srand() * VW), Math.floor(srand() * 110), 1, 1); }
  g.fillStyle = 'rgba(240,230,190,.12)'; g.beginPath(); g.arc(262, 40, 26, 0, 7); g.fill();
  g.fillStyle = '#efe8c4'; g.beginPath(); g.arc(262, 40, 15, 0, 7); g.fill();
  g.fillStyle = '#d4cca4'; g.fillRect(256, 34, 4, 3); g.fillRect(265, 44, 5, 3); g.fillRect(259, 46, 3, 2);
});
const P2 = Math.PI * 2 / 640;
const farLayer = mk(640, VH, g => {
  g.fillStyle = '#211a3c';
  g.beginPath(); g.moveTo(0, VH);
  for (let x = 0; x <= 640; x += 2) g.lineTo(x, 112 - Math.sin(x * P2 * 2) * 16 - Math.sin(x * P2 * 5 + 1) * 9 - Math.sin(x * P2 * 11) * 4);
  g.lineTo(640, VH); g.fill();
  // Castillo lejano
  g.fillStyle = '#18122e';
  g.fillRect(420, 70, 50, 50); g.fillRect(414, 56, 12, 64); g.fillRect(464, 52, 12, 68); g.fillRect(438, 44, 14, 30);
  for (let x = 414; x < 476; x += 4) g.fillRect(x, 66, 2, 4);
  g.fillStyle = '#e8c040'; g.fillRect(443, 52, 2, 3); g.fillRect(419, 64, 2, 2); g.fillRect(468, 62, 2, 2); g.fillRect(450, 84, 2, 3);
});
const midLayer = mk(640, VH, g => {
  g.fillStyle = '#140f26';
  g.beginPath(); g.moveTo(0, VH);
  for (let x = 0; x <= 640; x += 2) g.lineTo(x, 140 - Math.sin(x * P2 * 3) * 10 - Math.sin(x * P2 * 7 + 2) * 6);
  g.lineTo(640, VH); g.fill();
  const tree = (x, y, h) => { g.fillRect(x, y - h, 3, h); g.fillRect(x - 6, y - h + 6, 7, 2); g.fillRect(x + 2, y - h + 10, 8, 2); g.fillRect(x - 8, y - h + 4, 2, 4); g.fillRect(x + 9, y - h + 7, 2, 5); };
  [60, 210, 330, 470, 590].forEach((x, i) => tree(x, 142, 26 + (i % 2) * 8));
  [130, 260, 400, 530].forEach(x => { g.fillRect(x, 126, 2, 12); g.fillRect(x - 3, 129, 8, 2); });
});

// ------------------------------------------------------------------
// Estado
// ------------------------------------------------------------------
let state = 'title', paused = false, T = 0, overT = 0, clearT = 0, clearBonus = 0;
let score = 0, hi = 0, lives = 3, loop = 1, checkpoint = 0, timeLeft = 180, diff = 1;
let player = null, enemies = [], chests = [], items = [], pshots = [], eshots = [], fires = [], parts = [], pops = [], plats = [], flags = [];
let boss = null, bossActive = false, bossDone = false, lockCam = false, camX = 0, titleCam = 0, shake = 0, fireId = 0;
let zombieT = 2, ghostT = 4, crowT = 3, banner = null;
try { hi = +localStorage.getItem('nochetumbas_hi') || 0; } catch (e) {}

const SPEED = 82, JUMP = 278, G = 820, CLIMB = 55;
const WEAP = {
  lanza:    { sp: 300, max: 2, dmg: 1, w: 14, h: 3, name: 'LANZA' },
  daga:     { sp: 430, max: 3, dmg: 1, w: 8,  h: 3, name: 'DAGA' },
  antorcha: { sp: 150, max: 2, dmg: 2, w: 7,  h: 7, name: 'ANTORCHA' }
};

function resetRun() { score = 0; lives = 3; loop = 1; checkpoint = 0; startLife(); }
function startLife() {
  diff = 1 + (loop - 1) * .3;
  buildLevel(); spawnEntities();
  const sx = checkpoint ? 129 * TS : 2 * TS;
  player = { x: sx, y: GROUND_Y - 22, w: 10, h: 22, vx: 0, vy: 0, jumpVx: 0, face: 1, onGround: true, onPlat: null,
    crouch: false, climb: false, climbAnim: 0, armor: true, weapon: 'lanza', inv: 1.5, throwT: 0, hurtT: 0,
    dead: false, fell: false, deadT: 0, anim: 0 };
  timeLeft = 180; boss = null; bossActive = false; bossDone = false; lockCam = false;
  camX = clamp(sx - VW / 2 + 40, 0, COLS * TS - VW);
  zombieT = 2; ghostT = 4; crowT = 3; shake = 0; paused = false;
  state = 'play';
  banner = { a: checkpoint ? 'PUNTO DE CONTROL' : (loop > 1 ? 'VUELTA ' + loop : '¡ADELANTE, SIR FERRÁN!'), b: checkpoint ? 'Cementerio profundo' : 'Cementerio maldito', t: 2.5 };
}
function spawnEntities() {
  enemies = []; chests = []; items = []; pshots = []; eshots = []; fires = []; parts = []; pops = [];
  plats = [
    { x0: 96 * TS + 2,  x1: 103 * TS - 34, x: 96 * TS + 2,   y: 152, w: 32, h: 6, dir: 1,  sp: 32 * diff, dx: 0 },
    { x0: 107 * TS + 2, x1: 114 * TS - 34, x: 114 * TS - 34, y: 152, w: 32, h: 6, dir: -1, sp: 38 * diff, dx: 0 },
    { x0: 118 * TS + 2, x1: 125 * TS - 34, x: 118 * TS + 2,  y: 152, w: 32, h: 6, dir: 1,  sp: 44 * diff, dx: 0 }
  ];
  const crow = (c, topY) => enemies.push({ type: 'crow', x: c * TS + 2, y: topY - 8, w: 12, h: 8, hp: 1, face: -1, state: 'perch', t: 0, flash: 0, baseY: topY - 8 });
  crow(21, 144); crow(41, 144); crow(75, 64); crow(147, 144);
  const chest = (x, y) => chests.push({ x, y, w: 16, h: 12, hp: 2, flash: 0 });
  chest(30 * TS, GROUND_Y - 12); chest(70 * TS + 8, 32 - 12); chest(105 * TS, GROUND_Y - 12); chest(143 * TS, 112 - 12); chest(165 * TS, GROUND_Y - 12);
  const devil = (c, y) => enemies.push({ type: 'devil', x: c * TS, y, w: 16, h: 18, hp: 4 + (loop - 1) * 2, face: -1, state: 'wait', side: 1, fireT: 2, st: 0, hoverDur: 2.5, t: 0, flash: 0, baseY: y });
  devil(111, 70); devil(171, 64);
  flags = [{ c: 128, on: checkpoint > 0 }];
}

// ------------------------------------------------------------------
// Física con tiles
// ------------------------------------------------------------------
function collideX(o) {
  const top = Math.floor(o.y / TS), bot = Math.floor((o.y + o.h - 1) / TS);
  if (o.vx > 0) {
    const c = Math.floor((o.x + o.w) / TS);
    for (let r = top; r <= bot; r++) if (isSolid(get(c, r))) { o.x = c * TS - o.w - .01; return true; }
  } else if (o.vx < 0) {
    const c = Math.floor(o.x / TS);
    for (let r = top; r <= bot; r++) if (isSolid(get(c, r))) { o.x = (c + 1) * TS; return true; }
  }
  return false;

  for (const s of eshots) {
    if (s.kind === 'fire') { const k = Math.floor(T * 15) % 2; R(s.x - k, s.y - k, 5 + 2 * k, 5 + 2 * k, '#ff5010'); R(s.x + 1, s.y + 1, 3, 3, '#ffe060'); }
    else { R(s.x, s.y, 7, 7, '#4a4656'); R(s.x + 1, s.y, 5, 6, '#7a7688'); R(s.x + 2, s.y + 1, 2, 2, '#a8a4b8'); }
  }
  if (player && state !== 'title') {
    const p = player;
    if (p.dead) { if (!p.fell) { if (p.deadT < .5) { if (Math.floor(T * 20) % 2) drawKnight(p); } else drawBones(p); } }
    else if (!(p.inv > 0 && Math.floor(T * 16) % 2 === 0)) drawKnight(p);
  }
  // Agua por encima (los que caen quedan sumergidos)
  for (let c = c0; c <= c1; c++) for (let r = 0; r < ROWS; r++) if (get(c, r) === 4) {
    const x = c * TS, y = r * TS, top = get(c, r - 1) !== 4;
    R(x, y, 16, 16, '#173a7a');
    if (top) { R(x, y, 16, 2, '#5f9ae0'); const o = Math.floor(T * 6 + c * 3) % 16; R(x + o, y + 3, 3, 1, '#3a6ac0'); R(x + (o + 8) % 16, y + 6, 2, 1, '#2a5aa8'); }
    else R(x + ((Math.floor(T * 3) + c * 5) % 12), y + 6, 3, 1, '#24509a');
  }
  for (const q of parts) R(q.x, q.y, q.sz, q.sz, q.col);
  b.restore();
}

// ------------------------------------------------------------------
// Dibujo: interfaz (en alta resolución sobre el juego)
// ------------------------------------------------------------------
function otext(s, x, y, size, col, align = 'left') {
  const px = size * S;
  ctx.font = `${px}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  const X = OX + x * S, Y = OY + y * S;
  ctx.fillStyle = '#000'; ctx.fillText(s, X + Math.max(1, px * .12), Y + Math.max(1, px * .12));
  ctx.fillStyle = col; ctx.fillText(s, X, Y);
}
function hud() {
  const p = player;
  otext('PUNTOS', 6, 4, 6, '#ff5050'); otext(String(score).padStart(6, '0'), 6, 12, 7, '#fff');
  otext('RÉCORD', 112, 4, 6, '#ff5050'); otext(String(Math.max(hi, score)).padStart(6, '0'), 112, 12, 7, '#fff');
  const tm = Math.ceil(timeLeft), ts = Math.floor(tm / 60) + ':' + String(tm % 60).padStart(2, '0');
  otext('TIEMPO', 214, 4, 6, '#ff5050'); otext(ts, 214, 12, 7, tm < 30 && Math.floor(T * 4) % 2 ? '#ff3030' : '#fff');
  if (boss) {
    otext('CÍCLOPE', 160, 26, 5, '#e0a0ff', 'center');
  }
  if (banner) {
    const a = Math.min(1, banner.t * 2);
    ctx.globalAlpha = a;
    otext(banner.a, 160, 70, 9, '#ffe060', 'center'); otext(banner.b, 160, 86, 6, '#cfd8ff', 'center');
    ctx.globalAlpha = 1;
  }
  for (const o of pops) { ctx.globalAlpha = Math.min(1, o.t * 2); otext(o.s, o.x - camX, o.y, 5, o.col, 'center'); }
  ctx.globalAlpha = 1;
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(OX, OY, VW * S, VH * S);
    otext('PAUSA', 160, 80, 12, '#fff', 'center'); otext(isTouch ? 'Toca para seguir' : 'P para seguir', 160, 100, 6, '#cfd8ff', 'center');
  }
}
function hudBuffer() { // iconos pixelados dentro del buffer
  const p = player;
  R(286, 3, 30, 18, '#000'); R(287, 4, 28, 16, '#2a2440');
  const fake = { kind: p.weapon, x: 294, y: 7, t: 0, vy: null }; drawItem(fake);
  for (let i = 0; i < lives - 1; i++) { const x = 6 + i * 11, y = 180; R(x, y, 8, 7, '#d7deec'); R(x, y, 2, 7, '#8e9ab6'); R(x + 4, y + 3, 4, 1, '#151520'); R(x + 1, y - 2, 5, 2, '#d8283c'); }
  if (boss) { R(99, 33, 122, 6, '#000'); R(100, 34, 120 * Math.max(0, boss.hp / boss.max), 4, '#c040ff'); R(100, 34, 120 * Math.max(0, boss.hp / boss.max), 1, '#f0b0ff'); }
}
function touchControls() {
  if (!isTouch || state !== 'play') return;
  ctx.globalAlpha = .35; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  const cx = 95, cy = H - 95;
  ctx.beginPath(); ctx.arc(cx, cy, 70, 0, 7); ctx.stroke();
  const arrow = (dx, dy, on) => { ctx.globalAlpha = on ? .8 : .35; ctx.beginPath(); ctx.arc(cx + dx * 42, cy + dy * 42, 18, 0, 7); ctx.fill(); };
  arrow(-1, 0, tc.left); arrow(1, 0, tc.right); arrow(0, -1, tc.up); arrow(0, 1, tc.down);
  const btn = (x, y, l, on, col) => { ctx.globalAlpha = on ? .85 : .45; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 38, 0, 7); ctx.fill(); ctx.globalAlpha = .9; ctx.fillStyle = '#fff'; ctx.font = `11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, x, y); };
  btn(W - 65, H - 110, 'SALTO', tc.jump, '#3a6ad0'); btn(W - 150, H - 65, 'LANZA', tc.fire, '#d03a3a');
  ctx.globalAlpha = .5; ctx.fillStyle = '#fff'; ctx.fillRect(W - 38, 20, 5, 20); ctx.fillRect(W - 27, 20, 5, 20);
  ctx.globalAlpha = 1;
}

function render() {
  if (state === 'title') {
    const cam = (titleCam % (170 * TS));
    drawWorld(cam);
  } else {
    drawWorld(camX);
    if (state === 'play') hudBuffer();
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, OX, OY, VW * S, VH * S);

  if (state === 'title') {
    ctx.fillStyle = 'rgba(5,0,15,.55)'; ctx.fillRect(OX, OY, VW * S, VH * S);
    otext('NOCHE DE', 160, 22, 12, '#cfd8ff', 'center');
    otext('TUMBAS', 160, 38, 22, '#e02838', 'center');
    otext('La leyenda de Sir Ferrán', 160, 66, 6, '#ffe060', 'center');
    const story = ['El Rey Demonio ha raptado a la princesa.', 'Cruza el cementerio maldito y el río del', 'bosque, y vence al Cíclope de la puerta.'];
    story.forEach((l, i) => otext(l, 160, 84 + i * 10, 5, '#e6e2f4', 'center'));
    const ctl = isTouch
      ? ['Cruceta: mover · arriba/abajo escaleras', 'SALTO y LANZA a la derecha']
      : ['Flechas: mover · ↑↓ escaleras / agacharse', 'Z o ESPACIO: saltar · X: lanzar', 'P: pausa · M: sonido'];
    ctl.forEach((l, i) => otext(l, 160, 122 + i * 9, 5, '#9fb0dd', 'center'));
    if (Math.floor(T * 2.5) % 2) otext(isTouch ? 'TOCA PARA EMPEZAR' : 'PULSA ESPACIO', 160, 160, 7, '#fff', 'center');
    if (hi) otext('RÉCORD ' + hi, 160, 176, 5, '#ff8080', 'center');
  } else if (state === 'play') {
    hud(); touchControls();
  } else if (state === 'over') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(.75, overT)})`; ctx.fillRect(OX, OY, VW * S, VH * S);
    otext('FIN DE LA PARTIDA', 160, 64, 11, '#e02838', 'center');
    otext('PUNTOS ' + score, 160, 92, 7, '#fff', 'center');
    otext('RÉCORD ' + hi, 160, 106, 6, '#ffe060', 'center');
    if (overT > 1.5 && Math.floor(T * 2.5) % 2) otext(isTouch ? 'TOCA PARA CONTINUAR' : 'PULSA ESPACIO', 160, 140, 7, '#cfd8ff', 'center');
  } else if (state === 'clear') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(.7, clearT)})`; ctx.fillRect(OX, OY, VW * S, VH * S);
    otext('¡FASE SUPERADA!', 160, 46, 11, '#ffe060', 'center');
    otext('La puerta del castillo se abre...', 160, 70, 5, '#cfd8ff', 'center');
    otext('BONUS ' + clearBonus, 160, 92, 7, '#fff', 'center');
    otext('PUNTOS ' + score, 160, 106, 7, '#fff', 'center');
    otext('Pero la princesa está en otro castillo...', 160, 126, 5, '#ff9090', 'center');
    otext('VUELTA ' + (loop + 1) + ': los muertos están más inquietos', 160, 138, 5, '#ff9090', 'center');
    if (clearT > 2.5 && Math.floor(T * 2.5) % 2) otext(isTouch ? 'TOCA PARA SEGUIR' : 'PULSA ESPACIO', 160, 162, 7, '#fff', 'center');
  }
  if (muted) otext('SIN SONIDO', 316, 182, 4, '#888', 'right');
}

// ------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render();
  for (const k in press) press[k] = false;
  requestAnimationFrame(frame);
}
resize();
buildLevel();
requestAnimationFrame(frame);
</script>
</body>
</html>
