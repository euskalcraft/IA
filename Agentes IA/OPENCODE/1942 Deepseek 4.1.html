/* ---------- utilidades ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,PI2=Math.PI*2;

function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function txt(s,x,y,size,color,align,weight,glow){
  ctx.save();ctx.font=(weight||600)+' '+size+'px ui-monospace,Consolas,monospace';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}

/* ---------- audio ---------- */
let ac=null,master=null,muted=(localStorage.getItem('1942_mute')==='1');
let crt=(localStorage.getItem('1942_crt')!=='0');
function audio(){
  if(!ac){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=muted?0:.9;master.connect(ac.destination);
    }catch(e){}
  }
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
let noiseBuf=null;
function noise(){
  if(!ac)return null;
  if(!noiseBuf){
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function tone(f0,f1,dur,type,vol,delay){
  const a=audio();if(!a||muted)return;
  const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t0+.007);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function burst(dur,vol,f0,f1,delay){
  const a=audio();if(!a||muted)return;
  const src=a.createBufferSource();src.buffer=noise();
  const flt=a.createBiquadFilter();flt.type='lowpass';
  const g=a.createGain();const t0=a.currentTime+(delay||0);
  flt.frequency.setValueAtTime(f0,t0);flt.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(flt);flt.connect(g);g.connect(master);
  src.start(t0);src.stop(t0+dur+.02);
}

/* ---------- sprites ---------- */
function sprite(w,h,fn){
  const c=document.createElement('canvas');c.width=w*3;c.height=h*3;
  const g=c.getContext('2d');g.scale(3,3);fn(g);
  return{c:c,w:w,h:h};
}
function blit(sp,x,y,rot,alpha,scaleX){
  ctx.save();ctx.translate(x,y);
  if(rot)ctx.rotate(rot);
  if(scaleX!==undefined)ctx.scale(scaleX,1);
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.drawImage(sp.c,-sp.w/2,-sp.h/2,sp.w,sp.h);
  ctx.restore();
}
function starPath(g,cx,cy,r,rot){
  g.beginPath();
  for(let i=0;i<10;i++){
    const a=(rot===undefined?-Math.PI/2:rot)+i*Math.PI/5,rr=i%2?r*.42:r;
    const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
    if(i)g.lineTo(x,y);else g.moveTo(x,y);
  }
  g.closePath();
}

function makeShadow(sp){
  const c=document.createElement('canvas');c.width=sp.c.width;c.height=sp.c.height;
  const g=c.getContext('2d');g.drawImage(sp.c,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle='#001420';g.fillRect(0,0,c.width,c.height);
  return{c:c,w:sp.w,h:sp.h};
}

  ctx.save();ctx.translate(x+9,y+14);

  ctx.restore();
}

      g.beginPath();g.moveTo(-len/2+3,0);g.lineTo(len/2-3,0);g.stroke();
      g.setLineDash([]);g.restore();
    }
  }
  island(104,140,64,true);
  island(310,392,46,false);
  island(92,648,60,false);
  island(300,790,52,false);
  island(368,96,22,false);
  island(172,266,10,false);
  island(352,524,8,false);

  /* nubes suaves */
  for(let i=0;i<6;i++){
    const x=rnd(34,W-34),y=rnd(84,BGH-84),r=rnd(28,56);
    for(let k=0;k<6;k++){
      const ox=rnd(-r,r),oy=rnd(-r*.4,r*.4),rr=r*rnd(.5,.95);
      const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,rr);
      gr.addColorStop(0,'rgba(248,252,255,.26)');gr.addColorStop(.6,'rgba(240,248,252,.12)');gr.addColorStop(1,'rgba(240,248,252,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x+ox,y+oy,rr,0,PI2);g.fill();
    }
  }

})();

/* ---------- enemigos ---------- */
function mkEnemy(kind,x,y,opt){
  const b={kind:kind,x:x,y:y,x0:x,t:0,ph:rnd(0,PI2),ft:rnd(.7,1.7),hov:0,
    r:14,hp:1,score:100,mode:'dive',vy:90,sw:0,amp:0,ty:0,vx:0,tilt:0};
  if(kind===1){b.r=19;b.hp=3;b.score=300;b.vy=52;}
  if(kind===2){b.r=40;b.hp=22;b.score=1200;b.vy=26;b.ft=1.4;}
  const e=Object.assign(b,opt||{});
  enes.push(e);return e;
}
function wave(){
  const sp=1+(stage-1)*.10, pick=Math.random();
  if(pick<.30){
    const x0=rnd(70,W-70-4*52);
    for(let i=0;i<5;i++)mkEnemy(0,x0+i*52,-44-i*10,{mode:'sine',vy:rnd(72,96)*sp,amp:rnd(14,30),ph:i*.5});
  }else if(pick<.55){
    const cx=rnd(110,W-110);
    for(let i=-2;i<=2;i++)mkEnemy(0,cx+i*40,-46-Math.abs(i)*34,{mode:'dive',vy:rnd(86,108)*sp,sw:rnd(26,44),ph:i*.6});
  }else if(pick<.72){
    const left=Math.random()<.5, y0=rnd(90,230);
    for(let i=0;i<6;i++)mkEnemy(0,left?-30-i*26:W+30+i*26,y0+i*52,
      {mode:'diag',vx:(left?1:-1)*rnd(90,122)*sp,vy:rnd(30,56)*sp});
  }else if(pick<.88){
    const left=Math.random()<.5;
    for(let i=0;i<3;i++)mkEnemy(0,left?-40:W+40,rnd(130,430),
      {mode:'arc',vx:(left?1:-1)*112*sp,vy:70*sp,amp:rnd(40,80),ph:i*1.2});
  }else{
    const n=ri(2,3),x0=rnd(100,W-100);
    for(let i=0;i<n;i++)mkEnemy(1,x0+(i-(n-1)/2)*82,-64-i*40,{mode:'hover',ty:rnd(120,240),vy:46,amp:rnd(30,60)});
  }
}
function bigWave(){
  mkEnemy(2,W/2,-90,{mode:'hover',ty:150,vy:46,ft:1.6,amp:70});
  toast('¡BOMBARDERO!','#ff9a3a');
}
function enemyShoot(e){
  if(!player)return;
  const ang=Math.atan2(player.y-e.y,player.x-e.x);
  const n=e.kind===2?5:(e.kind===1?3:1);
  const spread=e.kind===2?.26:(e.kind===1?.20:.06);
  const sp=150+stage*8+(e.kind===2?35:0);
  const oy=e.kind===2?40:(e.kind===1?26:20);
  for(let i=0;i<n;i++){
    const a=ang+(i-(n-1)/2)*spread;
    ebul.push({x:e.x,y:e.y+oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:e.kind===2?7:5});
  }
  snd.eshoot();
}
function drop(e,force){
  let k;
  if(force)k='ala';
  else{const r=Math.random();k=r<.62?'ala':(r<.94?'medalla':'up');}
  items.push({x:e.x,y:e.y,k:k,t:0});
}
function killEnemy(j){
  const e=enes[j];if(!e)return;
  enes.splice(j,1);
  score+=e.score;
  if(e.kind===2){snd.bigboom();explode(e.x,e.y,44,'#ffb347',1.7);ring(e.x,e.y,'#ffd9a0');shake(8,.45);drop(e,true);}
  else if(e.kind===1){snd.boom();explode(e.x,e.y,24,'#ffcf6a',1.1);shake(4,.2);if(Math.random()<.45)drop(e);}
  else{snd.boom();explode(e.x,e.y,18,'#ffb347',.9);shake(2.2,.12);if(Math.random()<.13)drop(e);}
}
function collect(it){
  snd.pickup();
  if(it.k==='ala'){
    player.wing=Math.min(2,player.wing+1);
    score+=100;
    toast(player.wing>1?'¡ALA DOBLE!':'¡ALA!','#ffe066');
  }else if(it.k==='medalla'){score+=500;toast('+500','#ffe066');}
  else{lives=Math.min(5,lives+1);toast('¡1UP!','#ffffff');}
}
/* ---------- actualización ---------- */
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    if(p.sm){p.vy-=28*dt;p.vx*=.985;p.vy*=.985;}
    else p.vy+=400*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].life)rings.splice(i,1);}
}
function update(dt){
  time+=dt;
  bgY=(bgY+46*dt)%BGH;
  if(shakeT>0){shakeT=Math.max(0,shakeT-dt);if(shakeT===0)shakeMag=0;}
  if(flash>0)flash=Math.max(0,flash-dt*2.2);
  for(let i=toasts.length-1;i>=0;i--){toasts[i].t0+=dt;if(toasts[i].t0>toasts[i].life)toasts.splice(i,1);}
  updateParts(dt);
  if(state!=='playing')return;
  const p=player;if(!p)return;

  if(!drag){
    const dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);
    if(dx||dy){const n=Math.hypot(dx,dy);p.x+=dx/n*SPD*dt;p.y+=dy/n*SPD*dt;}
  }
  p.x=clamp(p.x,20,W-22);p.y=clamp(p.y,54,H-114);
  if(p.roll>0)p.roll-=dt;
  if(p.rollCd>0)p.rollCd-=dt;
  if(p.inv>0)p.inv-=dt;
  p.ft-=dt;
  if(p.ft<=0){p.ft=FIRE;shoot();}

  spawnT-=dt;
  if(spawnT<=0){
    waveIdx++;
    spawnT=Math.max(1.1,2.55-(stage-1)*.09);
    if(waveIdx%12===0){stage++;toast('FASE '+stage,'#ffe066');snd.stage();wave();}
    else if(waveIdx%6===0)bigWave();
    else if(enes.length<15)wave();
  }

  /* balas del jugador */
  for(let i=pbul.length-1;i>=0;i--){
    const b=pbul[i];b.y+=b.vy*dt;
    if(b.y<-26){pbul.splice(i,1);continue;}
    for(let j=enes.length-1;j>=0;j--){
      const e=enes[j];
      if(dist2(b.x,b.y,e.x,e.y)<(e.r+6)*(e.r+6)){
        pbul.splice(i,1);e.hp--;hurtFx(b.x,b.y);snd.hit();
        if(e.hp<=0)killEnemy(j);
        break;
      }
    }
  }

  /* balas enemigas */
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];if(!b)continue;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-40||b.y>H+40||b.x<-40||b.x>W+40){ebul.splice(i,1);continue;}
    if(p.inv<=0&&p.roll<=0&&dist2(b.x,b.y,p.x,p.y)<(11+b.r-2)*(11+b.r-2)){
      ebul.splice(i,1);hurt();
      if(state!=='playing')return;
      break;
    }
  }

  /* enemigos */
  for(let i=enes.length-1;i>=0;i--){
    const e=enes[i];e.t+=dt;
    if(e.mode==='dive'){
      e.y+=e.vy*dt;e.x+=Math.sin(e.t*2.2+e.ph)*e.sw*dt;
      e.tilt=Math.sin(e.t*2.2+e.ph)*.28;
    }else if(e.mode==='sine'){
      e.y+=e.vy*dt;e.x=e.x0+Math.sin(e.t*1.5+e.ph)*e.amp;
      e.tilt=Math.cos(e.t*1.5+e.ph)*.24;
    }else if(e.mode==='diag'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.tilt=e.vx>0?.34:-.34;
    }else if(e.mode==='arc'){
      e.x+=e.vx*dt;e.y+=(e.vy+Math.sin(e.t*2+e.ph)*70)*dt;e.tilt=e.vx>0?.42:-.42;
    }else if(e.mode==='hover'){
      if(e.y<e.ty)e.y+=e.vy*dt;
      else{
        e.hov+=dt;e.x=e.x0+Math.sin(e.t*.9+e.ph)*e.amp;
        if(e.hov>5.5)e.y-=34*dt;
      }
    }
    if(e.y>H+80||e.x<-100||e.x>W+100||e.y<-180){enes.splice(i,1);continue;}
    e.ft-=dt;
    if(e.ft<=0&&e.y>12&&e.y<H*.75){
      e.ft=(e.kind===2?1.35:e.kind===1?2.1:rnd(2.0,3.3))/(1+(stage-1)*.13);
      enemyShoot(e);
    }
    if(p.inv<=0&&p.roll<=0&&dist2(e.x,e.y,p.x,p.y)<(e.r+11)*(e.r+11)){
      killEnemy(i);hurt();
      if(state!=='playing')return;
    }
  }

  /* objetos */
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=72*dt;it.t+=dt;
    if(it.y>H+30){items.splice(i,1);continue;}
    if(dist2(it.x,it.y,p.x,p.y)<32*32){collect(it);items.splice(i,1);}
  }
}
/* ---------- dibujo ---------- */
function drawBg(){
  const off=bgY%BGH;
  ctx.drawImage(bgTile,0,off-BGH,W,BGH);
  ctx.drawImage(bgTile,0,off,W,BGH);
}
function star(cx,cy,r1,r2,n){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){
    const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r1:r2;
    ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);
  }
  ctx.closePath();
}
function drawItem(it){
  const x=it.x,y=it.y+Math.sin(it.t*4)*2.5;
  ctx.save();
  ctx.fillStyle='rgba(0,20,30,.25)';
  ctx.beginPath();ctx.ellipse(x+5,y+12,12,4.5,0,0,PI2);ctx.fill();
  if(it.k==='ala'){
    ctx.fillStyle='#efe3bb';ctx.strokeStyle='#8a6a22';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,13,0,PI2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#b02a2a';
    ctx.beginPath();
    ctx.moveTo(x,y-2);ctx.lineTo(x-9,y-6);ctx.lineTo(x-8,y+1);ctx.lineTo(x-2,y+2);
    ctx.lineTo(x+2,y+2);ctx.lineTo(x+8,y+1);ctx.lineTo(x+9,y-6);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#24467d';ctx.beginPath();ctx.arc(x,y,3.6,0,PI2);ctx.fill();
    ctx.fillStyle='#f2f4ea';starPath(ctx,x,y,2.8);ctx.fill();
  }else if(it.k==='medalla'){
    ctx.fillStyle='#1e3f78';
    ctx.beginPath();ctx.moveTo(x-6,y-13);ctx.lineTo(x+6,y-13);ctx.lineTo(x+3,y-3);ctx.lineTo(x-3,y-3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#b0232b';ctx.beginPath();ctx.moveTo(x-3,y-3);ctx.lineTo(x+3,y-3);ctx.lineTo(x+5,y+2);ctx.lineTo(x-5,y+2);ctx.closePath();ctx.fill();
    const g=ctx.createRadialGradient(x-3,y-2,1,x,y,10);
    g.addColorStop(0,'#fff6c4');g.addColorStop(.55,'#f0c334');g.addColorStop(1,'#a87c10');
    ctx.fillStyle=g;ctx.strokeStyle='#6b4e00';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(x,y+3,9.5,0,PI2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7a5a00';starPath(ctx,x,y+3,5.4);ctx.fill();
  }else{
    ctx.fillStyle='#f2ecd6';ctx.strokeStyle='#8a1f1f';ctx.lineWidth=2.4;
    rrect(ctx,x-17,y-11,34,22,4);ctx.fill();ctx.stroke();
    txt('1UP',x,y+1,10,'#b0232b','center',800);
  }
  ctx.restore();
}
function drawPart(){
  ctx.save();
  for(const p of parts){
    if(!p.sm)continue;
    const q=clamp(p.t/p.life,0,1),a=1-q;
    ctx.globalAlpha=a*.42;
    ctx.fillStyle=q<.4?'#9aa2a6':'#6f777d';
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1+q*1.8),0,PI2);ctx.fill();
  }
  for(const p of parts){
    if(p.sm)continue;
    const q=clamp(p.t/p.life,0,1),a=1-q;
    ctx.globalAlpha=a;
    ctx.fillStyle=q<.15?'#fff6cc':q<.45?'#ffcf3a':q<.75?'#ff9226':'#d94a12';
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1-q*.4),0,PI2);ctx.fill();
  }
  for(const r of rings){
    const q=r.t/r.life;
    ctx.globalAlpha=clamp(1-q,0,1);
    ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-q)+.5;
    ctx.beginPath();ctx.arc(r.x,r.y,8+q*64,0,PI2);ctx.stroke();
  }
  ctx.restore();
}
function drawMiniWing(x,y){
  ctx.save();
  ctx.fillStyle='#77864b';ctx.strokeStyle='#333c1e';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+9,y+2);ctx.lineTo(x+8,y+6);ctx.lineTo(x,y+3);ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#24467d';ctx.beginPath();ctx.arc(x+2,y+1,2.6,0,PI2);ctx.fill();
  ctx.fillStyle='#f2f4ea';starPath(ctx,x+2,y+1,2.1);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  const p=player;if(!p)return;
  if(p.inv>0&&p.roll<=0&&Math.floor(time*16)%2===0)return;
  ctx.save();
  ctx.translate(p.x,p.y);
  if(p.roll>0){
    const q=1-p.roll/ROLL_T;
    const ph=Math.sin(q*Math.PI*3);
    ctx.rotate(ph*.5);
    ctx.scale(Math.abs(Math.cos(q*Math.PI*3))*.82+.18,1);
    ctx.globalAlpha=.92;
  }
  ctx.drawImage(SP_PLAYER.c,-SP_PLAYER.w/2,-SP_PLAYER.h/2,SP_PLAYER.w,SP_PLAYER.h);
  ctx.restore();
  if(p.wing>0){
    const off=p.wing>1?44:30;
    drawMiniWing(p.x-off,p.y+6);
    drawMiniWing(p.x+off,p.y+6);
  }
}
function drawShadows(){
  for(const e of enes)blitShadow(e.kind===2?SH_BIG:(e.kind===1?SH_BOMBER:SH_ZERO),e.x,e.y,Math.PI-e.tilt);
  const p=player;
  if(p&&!(p.inv>0&&p.roll<=0&&Math.floor(time*16)%2===0))blitShadow(SH_PLAYER,p.x,p.y,0);
}
function drawWorld(){
  ctx.save();
  const k=(shakeT>0&&shakeDur)?shakeT/shakeDur:0;
  if(k>0)ctx.translate(rnd(-1,1)*shakeMag*k,rnd(-1,1)*shakeMag*k);
  drawShadows();
  for(const it of items)drawItem(it);
  for(const b of ebul)blit(b.r>6?SP_BB:SP_EB,b.x,b.y);
  for(const e of enes)blit(e.kind===2?SP_BIG:(e.kind===1?SP_BOMBER:SP_ZERO),e.x,e.y,Math.PI-e.tilt);
  for(const b of pbul)blit(SP_PB,b.x,b.y);
  drawPlayer();
  drawPart();
  ctx.restore();
}
function drawLifeIcon(x,y){
  ctx.save();ctx.fillStyle='#e9edcf';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x,y-7);ctx.lineTo(x+2.6,y-1);ctx.lineTo(x+8,y+2);ctx.lineTo(x+8,y+4);
  ctx.lineTo(x+2,y+3.2);ctx.lineTo(x,y+7);ctx.lineTo(x-2,y+3.2);ctx.lineTo(x-8,y+4);
  ctx.lineTo(x-8,y+2);ctx.lineTo(x-2.6,y-1);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function txtO(s,x,y,size,color,align,ol){
  ctx.save();
  ctx.font='800 '+size+'px "Courier New",ui-monospace,monospace';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=ol||3;ctx.strokeStyle='rgba(0,0,0,.88)';
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color;ctx.fillText(s,x,y);
  ctx.restore();
}
function drawHud(){
  const g=ctx.createLinearGradient(0,0,0,52);
  g.addColorStop(0,'rgba(0,12,22,.50)');g.addColorStop(1,'rgba(0,12,22,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,52);
  txtO('1UP',12,12,11,'#ff5a4a');
  txtO(zpad(score),12,31,16,'#ffffff');
  txtO('HI-SCORE',W-12,12,11,'#ff5a4a','right');
  txtO(zpad(Math.max(hi,score)),W-12,31,16,'#ffe9a8','right');
  txtO('FASE '+stage,W/2,12,10,'#d7ecf7','center',3);
  const n=Math.min(lives,5),x0=W/2-(n-1)*9;
  for(let i=0;i<n;i++)drawLifeIcon(x0+i*18,32);
}
function drawButtons(){
  if(state!=='playing')return;
  ctx.save();
  ctx.fillStyle='rgba(8,20,28,.45)';ctx.strokeStyle='rgba(232,224,190,.35)';ctx.lineWidth=1.2;
  rrect(ctx,12,H-44,44,30,6);ctx.fill();ctx.stroke();
  txtO('II',34,H-29,12,'#e8ecd8','center',2);
  rrect(ctx,62,H-44,44,30,6);ctx.fill();ctx.stroke();
  txtO('M',84,H-29,12,muted?'#8a8f8a':'#e8ecd8','center',2);
  ctx.restore();

  const p=player;if(!p)return;
  const cx=W-48,cy=H-48,r=30,ready=p.rollCd<=0;
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,PI2);
  ctx.fillStyle=ready?'rgba(224,198,120,.16)':'rgba(90,96,92,.12)';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=ready?'#e8d49a':'#7d827c';ctx.stroke();
  if(!ready){
    const q=clamp(1-p.rollCd/(ROLL_T+ROLL_CD),0,1);
    ctx.beginPath();ctx.arc(cx,cy,r-5,-Math.PI/2,-Math.PI/2+q*PI2);
    ctx.strokeStyle='#ffd98a';ctx.lineWidth=3;ctx.stroke();
  }
  txtO('ROLL',cx,cy-4,11,ready?'#fff6d8':'#8b8f8a','center',2);
  txtO('VIRADA',cx,cy+10,7,ready?'#d8c690':'#767a76','center',2);
  ctx.restore();
}
function drawToasts(){
  toasts.forEach((t,i)=>{
    const p=t.t0/t.life,a=p<.1?p/.1:p>.72?(1-p)/.28:1;
    ctx.save();ctx.globalAlpha=clamp(a,0,1);
    txtO(t.t,W/2,116+i*24-p*14,17,t.c,'center',4);
    ctx.restore();
  });
}
/* ---------- pantallas ---------- */
function pauseButtons(){
  const bw=252,bh=44,gap=12,x=(W-bw)/2,y=H*.46;
  uiBtns=[
    {x:x,y:y,w:bw,h:bh,label:'CONTINUAR',fn:togglePause,ac:'#c8b780'},
    {x:x,y:y+bh+gap,w:bw,h:bh,label:'SONIDO: '+(muted?'NO':'SÍ'),fn:toggleMute,ac:'#c8b780'},
    {x:x,y:y+2*(bh+gap),w:bw,h:bh,label:'CRT: '+(crt?'SÍ':'NO'),fn:toggleCrt,ac:'#c8b780'},
    {x:x,y:y+3*(bh+gap),w:bw,h:bh,label:'REINICIAR',fn:startGame,ac:'#ff9a3c'}
  ];
  return uiBtns;
}
function drawPause(){
  ctx.save();ctx.fillStyle='rgba(2,10,16,.78)';ctx.fillRect(0,0,W,H);ctx.restore();
  txtO('PAUSA',W/2,H*.32,38,'#ffe066','center',4);
  const btns=pauseButtons();
  for(const b of btns){
    ctx.save();
    ctx.fillStyle='rgba(8,20,26,.90)';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#c8b780';ctx.lineWidth=1.6;ctx.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
    ctx.strokeStyle='rgba(200,183,128,.30)';ctx.lineWidth=1;ctx.strokeRect(b.x+5,b.y+5,b.w-10,b.h-10);
    ctx.restore();
    txtO(b.label,W/2,b.y+b.h/2,13,'#f2ecd6','center',3);
  }
  txtO('M SONIDO · V CRT · R REINICIAR',W/2,H*.46+4*56+22,9,'#93a8a0','center',2);
}
function drawTitle(){
  ctx.save();ctx.fillStyle='rgba(2,12,22,.62)';ctx.fillRect(0,0,W,H);ctx.restore();
  const gl=ctx.createRadialGradient(W/2,150,10,W/2,150,200);
  gl.addColorStop(0,'rgba(255,206,70,.10)');gl.addColorStop(1,'rgba(255,206,70,0)');
  ctx.save();ctx.fillStyle=gl;ctx.fillRect(0,0,W,360);ctx.restore();

  const ly=140;
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 94px "Courier New",ui-monospace,monospace';
  ctx.fillStyle='#7d1414';ctx.fillText('1942',W/2+7,ly+7);
  ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle='#1b0f06';ctx.strokeText('1942',W/2,ly);
  const gr=ctx.createLinearGradient(0,ly-48,0,ly+48);
  gr.addColorStop(0,'#fff0a0');gr.addColorStop(.45,'#ffcc22');gr.addColorStop(1,'#d98a00');
  ctx.fillStyle=gr;ctx.fillText('1942',W/2,ly);
  ctx.lineWidth=2;ctx.strokeStyle='rgba(90,50,0,.55)';ctx.strokeText('1942',W/2,ly);
  ctx.restore();

  ctx.save();ctx.fillStyle='rgba(255,224,102,.20)';ctx.fillRect(W/2-150,ly+52,300,1);ctx.restore();
  txtO('BATALLA AÉREA DEL PACÍFICO',W/2,ly+68,12,'#f2e8c6','center',3);
  txtO('HOMENAJE AL CLÁSICO DE 1984',W/2,ly+88,9,'#a9bdb0','center',3);

  const bob=Math.sin(time*1.6)*3;
  ctx.save();
  ctx.translate(W/2,315+bob);
  ctx.scale(1.85,1.85);
  ctx.globalAlpha=.30;ctx.drawImage(SH_PLAYER.c,-28+8,-34+10,56,68);
  ctx.globalAlpha=1;ctx.drawImage(SP_PLAYER.c,-28,-34,56,68);
  ctx.restore();

  const bx=48,by=400,bw=W-96,bh=118;
  ctx.save();
  ctx.fillStyle='rgba(6,18,26,.74)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#c8b780';ctx.lineWidth=2;ctx.strokeRect(bx+4,by+4,bw-8,bh-8);
  ctx.strokeStyle='rgba(200,183,128,.32)';ctx.lineWidth=1;ctx.strokeRect(bx+8,by+8,bw-16,bh-16);
  ctx.restore();
  const rows=[
    ['← → ↑ ↓ / WASD','MOVER EL AVIÓN'],
    ['ARRASTRA','MOVER (TÁCTIL)'],
    ['ESPACIO / ROLL','VIRADA EVASIVA'],
    ['P / ESC','PAUSA']
  ];
  rows.forEach((r,i)=>{
    const y=by+27+i*23;
    txtO(r[0],bx+18,y,10,'#ffe9a8','left',2);
    txtO(r[1],bx+bw-18,y,10,'#dfe9d6','right',2);
  });

  txtO('RÉCORD   '+zpad(hi),W/2,by+bh+30,14,'#ffe066','center',3);
  if(Math.sin(time*3.4)>-.15)txtO('PULSA ENTER O TOCA PARA EMPEZAR',W/2,by+bh+64,14,'#ffffff','center',3);
  txtO('M SONIDO · V CRT',W/2,H-40,10,'#93a8a0','center',2);
  txtO('1 JUGADOR',W/2,H-24,9,'#c8b780','center',2);
  txtO(BUILD,W-10,H-6,8,'#5d736b','right',1);
}
function drawOver(){
  ctx.save();ctx.fillStyle='rgba(2,10,16,.72)';ctx.fillRect(0,0,W,H);ctx.restore();
  txtO('GAME OVER',W/2,262,40,'#ff4a3a','center',5);
  txtO('PUNTUACIÓN',W/2,326,11,'#f2e8c6','center',3);
  txtO(zpad(score),W/2,362,30,'#ffffff','center',4);
  if(score>0&&score>=hi)txtO('¡NUEVO RÉCORD!',W/2,404,14,'#ffe066','center',3);
  else txtO('RÉCORD  '+zpad(hi),W/2,404,12,'#c8d6c8','center',3);
  txtO('FASE ALCANZADA  '+stage,W/2,438,11,'#c8d6c8','center',3);
  if(Math.sin(time*3.4)>-.15)txtO('TOCA O PULSA ENTER PARA REINICIAR',W/2,500,13,'#ffffff','center',3);
  txtO('R REINICIAR · M SONIDO',W/2,534,10,'#93a8a0','center',2);
}

/* ---------- CRT ---------- */
let scanPat=null;
function drawCRT(){
  if(!crt)return;
  if(!scanPat){
    const oc=document.createElement('canvas');oc.width=4;oc.height=4;
    const g=oc.getContext('2d');g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,3,4,1);
    scanPat=ctx.createPattern(oc,'repeat');
  }
  ctx.save();
  ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const y=((time*80)%(H+200))-100;
  const bg=ctx.createLinearGradient(0,y-40,0,y+40);
  bg.addColorStop(0,'rgba(120,190,255,0)');bg.addColorStop(.5,'rgba(120,190,255,.045)');bg.addColorStop(1,'rgba(120,190,255,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,y-40,W,80);
  ctx.restore();
}

/* ---------- render ---------- */
function render(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawWorld();
  drawToasts();
  if(state!=='title')drawHud();
  drawButtons();
  if(state==='title')drawTitle();
  else if(state==='paused')drawPause();
  else if(state==='over')drawOver();
  if(flash>0){
    ctx.save();ctx.globalAlpha=Math.min(.55,flash*.55);
    ctx.fillStyle='#ff4d6d';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  drawCRT();
}

/* ---------- entrada ---------- */
function toGame(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};
}
function hitRect(x,y,b){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
const ROLL_BTN={cx:W-48,cy:H-48,r:30};
cv.addEventListener('pointerdown',e=>{
  audio();
  const p=toGame(e);
  if(state==='title'||state==='over'){startGame();return;}
  if(state==='paused'){
    for(const b of pauseButtons())if(hitRect(p.x,p.y,b)){b.fn();snd.ui();return;}
    return;
  }
  if(state!=='playing')return;
  if(dist2(p.x,p.y,ROLL_BTN.cx,ROLL_BTN.cy)<(ROLL_BTN.r+12)*(ROLL_BTN.r+12)){doRoll();return;}
  if(hitRect(p.x,p.y,{x:12,y:H-44,w:44,h:30})){togglePause();return;}
  if(hitRect(p.x,p.y,{x:62,y:H-44,w:44,h:30})){toggleMute();snd.ui();return;}
  drag={id:e.pointerId,sx:p.x,sy:p.y,px:player?player.x:W/2,py:player?player.y:0};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||state!=='playing'||!player)return;
  const p=toGame(e);
  player.x=clamp(drag.px+(p.x-drag.sx),20,W-22);
  player.y=clamp(drag.py+(p.y-drag.sy),54,H-114);
});
function endDrag(e){if(drag&&drag.id===e.pointerId)drag=null;}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
addEventListener('pointerup',endDrag);
cv.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('keydown',e=>{
  const k=e.key;
  if(k.indexOf('Arrow')===0||k===' '||k==='Spacebar')e.preventDefault();
  if(e.repeat)return;
  switch(k){
    case 'ArrowLeft':case 'a':case 'A':keys.l=true;break;
    case 'ArrowRight':case 'd':case 'D':keys.r=true;break;
    case 'ArrowUp':case 'w':case 'W':keys.u=true;break;
    case 'ArrowDown':case 's':case 'S':keys.d=true;break;
    case ' ':case 'Spacebar':case 'z':case 'Z':doRoll();break;
    case 'p':case 'P':case 'Escape':togglePause();break;
    case 'm':case 'M':toggleMute();break;
    case 'v':case 'V':toggleCrt();break;
    case 'r':case 'R':if(state!=='title')startGame();break;
    case 'Enter':
      if(state==='title'||state==='over')startGame();
      else if(state==='paused')togglePause();
      break;
  }
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false;
  else if(k==='ArrowUp'||k==='w'||k==='W')keys.u=false;
  else if(k==='ArrowDown'||k==='s'||k==='S')keys.d=false;
});
addEventListener('blur',()=>{
  keys.l=keys.r=keys.u=keys.d=false;drag=null;
  if(state==='playing')togglePause();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)return;
  keys.l=keys.r=keys.u=keys.d=false;drag=null;
  if(state==='playing')togglePause();
});

/* ---------- bucle ---------- */
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
