<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Infinito v8</title>
    <style>
        body { background: #202028; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        canvas { border: 4px solid #fff; background-color: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .info { margin-top: 10px; text-align: center; }
        #btn { padding: 10px 30px; font-size: 18px; cursor: pointer; background: #ff0055; color: white; border: none; margin-top: 10px; border-radius: 5px; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); transition: transform 0.1s; }
        #btn:active { transform: scale(0.95); }
        .game-over-msg { color: #ff0055; font-weight: bold; margin-top: 10px; display: none; font-size: 24px; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<canvas id="tetris" width="240" height="400"></canvas>
<div class="info">
    <h3>Tetris Infinito</h3>
    <p>Puntos: <span id="score">0</span></p>
    <button id="btn">EMPEZAR</button>
    <p><small>← → Mover | ↑ Rotar | ↓ Bajar</small></p>
    <div id="msg" class="game-over-msg">¡GAME OVER! Pulsa para reiniciar.</div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const btn = document.getElementById('btn');
const msgEl = document.getElementById('msg');

context.scale(20, 20); 
const arena = createMatrix(12, 20);
const player = { pos: {x: 0, y: 0}, matrix: null };

// Variables de estado
let isRunning = false;
let gameOver = false;
let dropCounter = 0;
let lastTime = 0;
let animationId = null;

function createMatrix(w, h) {
    const matrix = [];
    while (h--) {
        matrix.push(new Array(w).fill(0));
    }
    return matrix;
}

function createPiece(type) {
    if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
    if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
    if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
    if (type === 'O') return [[4, 4], [4, 4]];
    if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
    if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
    if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
}

const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    drawMatrix(arena, {x: 0, y: 0});
    if (player.matrix) drawMatrix(player.matrix, player.pos);
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.fillStyle = colors[value];
                context.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
            }
        });
    });
}

function collide(arena, player) {
    const m = player.matrix;
    const o = player.pos;
    const boardWidth = arena[0].length; 
    const boardHeight = arena.length;

    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0) {
                const newX = x + o.x;
                const newY = y + o.y;

                // Límites físicos
                if (newX < 0 || newX >= boardWidth || newY >= boardHeight) return true; 
                
                // Colisión con piezas fijas
                if (newY >= 0 && arena[newY] && arena[newY][newX] !== 0) return true;
            }
        }
    }
    return false;
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + player.pos.y][x + player.pos.x] = value;
            }
        });
    });
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
}

function playerReset() {
    const pieces = 'ILJOTSZ';
    player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
    player.pos.y = 0;
    
    // Centrado seguro
    const arenaWidth = arena[0].length;
    const pieceWidth = player.matrix[0].length;
    player.pos.x = Math.floor(arenaWidth / 2) - Math.floor(pieceWidth / 2);

    // Verificación de Game Over AL NACER
    if (collide(arena, player)) {
        gameOver = true;
        isRunning = false; 
        cancelAnimationFrame(animationId);
        msgEl.style.display = 'block';
        btn.innerText = "REINICIAR";
    }
}

function arenaSweep() {
    let rowCount = 0;
    outer: for (let y = arena.length - 1; y >= 0; --y) {
        let isRowFull = true;
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] !== 0) {
                isRowFull = false;
                break;
            }
        }
        
        if (isRowFull) {
            arena.splice(y, 1);
            arena.unshift(new Array(12).fill(0)); 
            rowCount++;
            y++; // Revisar la misma fila índice nuevamente tras eliminar
        }
    }
    
    if (rowCount > 0) {
        player.score += rowCount * 10;
        updateScore();
    }
}

function updateScore() {
    scoreEl.innerText = player.score;
}

// --- LÓGICA DE CAÍDA CORREGIDA ---
function playerDrop() {
    player.pos.y++;
    
    if (collide(arena, player)) {
        player.pos.y--; // Deshacer movimiento de caída
        
        merge(arena, player); // Fijar la pieza actual
        
        arenaSweep();
        updateScore();
        
        playerReset(); // Generar la siguiente pieza
        
        // Verificación de Game Over tras generar la nueva
        if (collide(arena, player)) {
            gameOver = true;
            isRunning = false; 
            cancelAnimationFrame(animationId);
            msgEl.style.display = 'block';
            btn.innerText = "REINICIAR";
        }
    }
    dropCounter = 0;
}

function update(time = 0) {
    if (!isRunning || gameOver) return;
    
    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;
    
    // Solo bajamos si estamos jugando y no hemos perdido
    if (dropCounter > 1000) { 
        playerDrop();
    }
    
    draw();
    animationId = requestAnimationFrame(update);
}

document.addEventListener('keydown', event => {
    if (!isRunning || gameOver) return;
    
    if (event.keyCode === 37) { // Izquierda
        player.pos.x -= 1;
        if (collide(arena, player)) player.pos.x += 1;
    } 
    else if (event.keyCode === 39) { // Derecha
        player.pos.x += 1;
        const maxCol = arena[0].length - player.matrix[0].length;
        if (player.pos.x > maxCol) player.pos.x -= 1; // Límite extra para seguridad
    }
    else if (event.keyCode === 38) rotatePiece(1); 
    else if (event.keyCode === 40) playerDrop(); 
});

function rotatePiece(dir) {
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix, dir);
    
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        
        if (Math.abs(offset) > player.matrix[0].length) { 
            rotate(player.matrix, -dir); 
            player.pos.x = pos; 
            return;
        }
    }
}

btn.addEventListener('click', () => {
    // Limpiar todo
    arena.forEach(row => row.fill(0));
    player.score = 0;
    updateScore();
    
    gameOver = false;
    isRunning = true;
    msgEl.style.display = 'none';
    btn.innerText = "EMPEZAR";
    
    // Resetear jugador y empezar el bucle
    playerReset(); 
    lastTime = performance.now();
    update();
});

</script>
</body>
</html>
