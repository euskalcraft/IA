<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vanguardia Estelar</title>
<style>
  html,body{margin:0;height:100%;background:#05010f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   VANGUARDIA ESTELAR — shooter espacial vertical (Canvas + WebAudio)
   Sin dependencias: un solo archivo HTML.
   ============================================================ */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Segoe UI",system-ui,-apple-system,sans-serif';

// ---------- Utilidades ----------
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const d2    = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

// ---------- Estado global ----------
let W = 0, H = 0, DPR = 1, bg = null, stars = [];
let state = 'menu', t = 0, overT = 0, newRecord = false;
let score = 0, hi = 0, wave = 0, waveClock = 0, waveGap = 0;
let player = null, bullets = [], ebullets = [], enemies = [], parts = [], pups = [], texts = [], rings = [], spawnQ = [];
let boss = null, shake = 0, flash = 0, banner = null, chain = 0, chainT = 0, isTouch = false;
try { hi = +localStorage.getItem('vanguardia_hi') || 0; } catch (e) {}

// ---------- Audio sintetizado ----------
let actx = null, muted = false, lastShootSfx = 0;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type = 'square', vol = .08, slide = 0) {
  if (muted || !actx) return;
  const n = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), n + d);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + d);
  o.connect(g).connect(actx.destination); o.start(n); o.stop(n + d);
}
function noise(d, vol = .2) {
  if (muted || !actx) return;
  const n = actx.currentTime, len = Math.floor(actx.sampleRate * d);
  const buf = actx.createBuffer(1, len, actx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = actx.createBufferSource(), g = actx.createGain(), fl = actx.createBiquadFilter();
  s.buffer = buf; g.gain.value = vol; fl.type = 'lowpass';
  fl.frequency.setValueAtTime(2000, n); fl.frequency.exponentialRampToValueAtTime(80, n + d);
  s.connect(fl).connect(g).connect(actx.destination); s.start(n);
}
const sfx = {
  shoot() { if (t - lastShootSfx > .09) { lastShootSfx = t; tone(900, .05, 'square', .018, -500); } },
  hit()   { tone(240, .04, 'sawtooth', .03, -120); },
  boom(big) { noise(big ? 1.2 : .35, big ? .45 : .2); if (big) tone(90, .8, 'sine', .25, -60); },
  power() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .12, 'triangle', .08), i * 60)); },
  hurt()  { tone(320, .45, 'sawtooth', .1, -260); noise(.35, .25); },
  bomb()  { noise(1.6, .55); tone(140, 1.1, 'sine', .3, -110); },
  boss()  { [196, 147, 196, 147].forEach((f, i) => setTimeout(() => tone(f, .28, 'sawtooth', .07), i * 260)); },
  shield(){ tone(600, .25, 'triangle', .08, 400); }
};

// ---------- Tamaño y fondo ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg(); initStars();
  if (player) { player.x = clamp(player.x, 20, W - 20); player.y = clamp(player.y, 40, H - 30); }
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060118'); g.addColorStop(1, '#0b0630');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const cols = ['131,56,236', '58,134,255', '247,37,133', '76,201,240'];
  for (let i = 0; i < 7; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = rand(160, 420), c = cols[i % cols.length];
    const rg = b.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${c},.16)`); rg.addColorStop(1, `rgba(${c},0)`);
    b.fillStyle = rg; b.fillRect(0, 0, W, H);
  }
}
function initStars() {
  stars = [];
  const n = Math.floor(W * H / 9000);
  for (let l = 0; l < 3; l++) for (let i = 0; i < n; i++)
    stars.push({ x: Math.random() * W, y: Math.random() * H, l, s: (l + 1) * .7 });
}

// ---------- Entrada ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { if (state === 'play') state = 'pause'; for (const k in keys) keys[k] = false; });

const ptr = { active: false, x: 0, y: 0 };
cv.addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'touch') isTouch = true;
  const used = onTap(e.clientX, e.clientY);
  if (state === 'play' && !used) { ptr.active = true; ptr.x = e.clientX; ptr.y = e.clientY; }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.active || state !== 'play') return;
  const k = isTouch ? 1.5 : 1.2;
  player.x = clamp(player.x + (e.clientX - ptr.x) * k, 20, W - 20);
  player.y = clamp(player.y + (e.clientY - ptr.y) * k, 40, H - 30);
  ptr.x = e.clientX; ptr.y = e.clientY;
});
addEventListener('pointerup', () => { ptr.active = false; });
addEventListener('pointercancel', () => { ptr.active = false; });

function onKey(c) {
  audio();
  if (c === 'KeyM') { muted = !muted; return; }
  if (state === 'menu' && (c === 'Space' || c === 'Enter')) start();
  else if (state === 'over' && (c === 'Space' || c === 'Enter') && overT > 1) start();
  else if (state === 'play') {
    if (c === 'KeyP' || c === 'Escape') state = 'pause';
    else if (c === 'KeyX' || c === 'KeyB' || c === 'ShiftLeft' || c === 'ShiftRight') bomb();
  }
  else if (state === 'pause' && (c === 'KeyP' || c === 'Escape' || c === 'Space')) state = 'play';
}
function onTap(x, y) {
  if (state === 'menu') { start(); return true; }
  if (state === 'over') { if (overT > 1) start(); return true; }
  if (state === 'pause') { state = 'play'; return true; }
  if (state === 'play') {
    if (Math.hypot(x - (W - 36), y - 36) < 28) { state = 'pause'; return true; }
    if (isTouch && Math.hypot(x - (W - 60), y - (H - 70)) < 42) { bomb(); return true; }
  }
  return false;
}

// ---------- Partida ----------
function newPlayer() {
  return { x: W / 2, y: H - 110, px: W / 2, lives: 3, inv: 2, pow: 1, bombs: 2, fire: 0, shield: 0, tilt: 0 };
}
function start() {
  audio();
  score = 0; wave = 0; chain = 0; chainT = 0; waveGap = 0; newRecord = false;
  bullets = []; ebullets = []; enemies = []; parts = []; pups = []; texts = []; rings = []; spawnQ = [];
  boss = null; shake = 0; flash = 0;
  player = newPlayer(); state = 'play';
  nextWave();
}
const mult = () => Math.min(8, 1 + Math.floor(chain / 5));

const WAVE_NAMES = ['Patrulla de reconocimiento', 'Escuadrón zigzag', 'Francotiradores', 'Acorazados', 'Cinturón de asteroides', 'Enjambre suicida', 'Flota pesada', 'Asalto total'];
function nextWave() {
  wave++; waveClock = 0; spawnQ = [];
  if (wave % 5 === 0) {
    banner = { txt: '¡ALERTA: JEFE!', sub: 'Oleada ' + wave + ' — Acorazado Nexus Mk.' + (wave / 5), t: 2.8, col: '#ff006e' };
    spawnQ.push({ at: 2.2, f: spawnBoss });
    sfx.boss();
    return;
  }
  banner = { txt: 'OLEADA ' + wave, sub: WAVE_NAMES[(wave - 1) % WAVE_NAMES.length], t: 2.2, col: '#4cc9f0' };
  const n = 7 + wave * 2;
  let at = 1.6;
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    let type = 'drone';
    if (wave >= 2 && r < .28) type = 'zig';
    if (wave >= 3 && r > .72) type = 'shooter';
    if (wave >= 4 && r > .91) type = 'tank';
    if (wave >= 6 && r > .28 && r < .42) type = 'kami';
    spawnQ.push({ at, f: () => spawnEnemy(type) });
    at += Math.max(.22, 1.05 - wave * .06) * rand(.6, 1.25);
  }
  // Formaciones en V
  const forms = wave >= 2 ? 1 + Math.floor(wave / 4) : 0;
  for (let k = 0; k < forms; k++) {
    const fx = rand(.2, .8), base = rand(2, at);
    for (let j = 0; j < 5; j++) spawnQ.push({ at: base + Math.abs(j - 2) * .18, f: () => spawnEnemy('drone', W * fx + (j - 2) * 42) });
  }
}

// ---------- Enemigos ----------
const ETYPES = {
  drone:   { hp: 2,  r: 14, sp: 115, score: 100, col: '#ff4d6d' },
  zig:     { hp: 3,  r: 14, sp: 120, score: 150, col: '#ffbe0b' },
  shooter: { hp: 6,  r: 17, sp: 90,  score: 250, col: '#b5179e' },
  tank:    { hp: 16, r: 26, sp: 45,  score: 600, col: '#3a86ff' },
  kami:    { hp: 2,  r: 12, sp: 190, score: 200, col: '#fb5607' }
};
function spawnEnemy(type, x, y) {
  const d = ETYPES[type], hp = Math.ceil(d.hp * (1 + wave * .09));
  enemies.push({
    type, x: x ?? rand(30, W - 30), y: y ?? -30, r: d.r, hp, max: hp,
    sp: d.sp * (1 + Math.min(wave, 20) * .03), t: rand(0, 6), fire: rand(1, 2.4),
    col: d.col, score: d.score, hitT: 0, stopY: rand(H * .12, H * .38), stay: 0, vx: 0, vy: 0,
    px: 0, bank: 0
  });
  const ne = enemies[enemies.length - 1]; ne.px = ne.x;
}
const aimAt = o => Math.atan2(player.y - o.y, player.x - o.x);
const ebSpeed = () => Math.min(360, 200 + wave * 8);
function eShoot(x, y, a, sp, col = '#ff5ec4', r = 5) {
  ebullets.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r, col });
}

function updEnemy(e, dt) {
  e.t += dt; e.hitT -= dt;
  switch (e.type) {
    case 'drone':
      e.y += e.sp * dt; e.x += Math.sin(e.t * 2) * 45 * dt; break;
    case 'zig':
      e.y += e.sp * .8 * dt; e.x += Math.cos(e.t * 3.5) * 190 * dt; break;
    case 'shooter':
      if (e.stay < 5) {
        if (e.y < e.stopY) e.y += e.sp * dt; else { e.stay += dt; e.x += Math.sin(e.t) * 70 * dt; }
      } else e.y += e.sp * 1.4 * dt;
      e.fire -= dt;
      if (e.fire <= 0 && e.y > 0) { eShoot(e.x, e.y + 12, aimAt(e), ebSpeed()); e.fire = rand(1.3, 2.3) / (1 + wave * .05); }
      break;
    case 'tank':
      e.y += e.sp * dt; e.fire -= dt;
      if (e.fire <= 0 && e.y > 0) {
        const a = Math.PI / 2;
        for (let k = -2; k <= 2; k++) eShoot(e.x, e.y + 20, a + k * .22, ebSpeed() * .8, '#5ab0ff', 6);
        e.fire = 2;
      }
      break;
    case 'kami':
      if (!e.dive) {
        e.y += e.sp * .55 * dt;
        if (e.y > H * .22 || e.t > 4) {
          e.dive = true; const a = aimAt(e);
          e.vx = Math.cos(a) * e.sp * 2; e.vy = Math.sin(a) * e.sp * 2;
          tone(500, .25, 'sawtooth', .03, 500);
        }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; }
      break;
  }
  if (e.type !== 'kami') e.x = clamp(e.x, e.r, W - e.r);
  if (dt > 0) { // alabeo al desplazarse en horizontal
    const vx = (e.x - e.px) / dt; e.px = e.x;
    e.bank += (clamp(vx / 220, -1, 1) - e.bank) * Math.min(1, dt * 8);
  }
  if (e.y > H + 60 || e.x < -80 || e.x > W + 80 || e.y < -200) e.dead = true;
}

function damage(e, dmg, x = e.x, y = e.y) {
  e.hp -= dmg; e.hitT = .06;
  spark(x, y, e.col, 3);
  if (e.hp <= 0 && !e.dead) kill(e);
}
function kill(e) {
  e.dead = true;
  const big = e.type === 'tank';
  explode(e.x, e.y, e.col, big ? 45 : 20, big ? 300 : 220);
  if (big) rings.push({ x: e.x, y: e.y, r: 5, max: 90, life: .5, col: e.col });
  sfx.boom(big);
  chain++; chainT = 2.2;
  const pts = e.score * mult(); score += pts;
  texts.push({ x: e.x, y: e.y, s: '+' + pts, life: .9, col: mult() > 1 ? '#ffbe0b' : '#fff', size: big ? 20 : 14 });
  shake = Math.max(shake, big ? 9 : 3);
  const chance = { tank: .6, shooter: .18, kami: .08, zig: .08, drone: .06 }[e.type];
  if (Math.random() < chance) dropPup(e.x, e.y);
}

// ---------- Jefe ----------
function spawnBoss() {
  const lvl = wave / 5, hp = 260 + lvl * 240;
  boss = { x: W / 2, y: -140, ty: Math.max(110, H * .2), hp, max: hp, t: 0, pat: 0, patT: 0, fire: 1, hitT: 0, entering: true, minT: 3 };
}
function updBoss(dt) {
  const b = boss; b.t += dt; b.hitT -= dt;
  if (b.entering) { b.y += (b.ty - b.y) * dt * 1.6; if (Math.abs(b.y - b.ty) < 4) b.entering = false; return; }
  const rage = b.hp < b.max * .5;
  b.x = W / 2 + Math.sin(b.t * .5) * Math.max(0, W / 2 - 115);
  b.patT += dt; if (b.patT > 5) { b.patT = 0; b.pat = (b.pat + 1) % 3; b.fire = .6; }
  b.fire -= dt;
  const bs = ebSpeed();
  if (b.fire <= 0) {
    if (b.pat === 0) {           // espiral
      const n = rage ? 3 : 2;
      for (let k = 0; k < n; k++) eShoot(b.x, b.y, b.t * 2.3 + k * Math.PI * 2 / n, bs * .85, '#ffbe0b');
      b.fire = rage ? .08 : .11;
    } else if (b.pat === 1) {    // ráfaga apuntada desde los cañones
      for (const s of [-1, 1]) { const o = { x: b.x + s * 95, y: b.y + 30 }, a = aimAt(o);
        for (let k = -1; k <= 1; k++) eShoot(o.x, o.y, a + k * .14, bs * 1.15, '#ff5ec4'); }
      b.fire = rage ? .45 : .7;
    } else {                     // anillo
      const n = rage ? 22 : 16, off = Math.random();
      for (let k = 0; k < n; k++) eShoot(b.x, b.y, off + k / n * Math.PI * 2, bs * .75, '#9d4edd', 6);
      b.fire = rage ? .8 : 1.15;
    }
  }
  if (rage) { b.minT -= dt; if (b.minT <= 0) { b.minT = 4.5; spawnEnemy('kami', b.x - 95, b.y + 20); spawnEnemy('kami', b.x + 95, b.y + 20); } }
}
const inBoss = (x, y, pad = 0) => boss && Math.abs(x - boss.x) < 92 + pad && Math.abs(y - boss.y) < 46 + pad;
function hitBoss(dmg, x, y) {
  const b = boss; b.hp -= dmg; b.hitT = .05; score += 10 * dmg;
  if (x !== undefined) spark(x, y, '#ff006e', 2);
  if (b.hp <= 0) bossDie();
}
function bossDie() {
  const b = boss, lvl = wave / 5;
  for (let i = 0; i < 8; i++) explode(b.x + rand(-90, 90), b.y + rand(-45, 45), ['#ff006e', '#ffbe0b', '#fff', '#9d4edd'][i % 4], 30, 360);
  rings.push({ x: b.x, y: b.y, r: 10, max: Math.max(W, H) * .7, life: 1, col: '#ffbe0b' });
  sfx.boom(true); setTimeout(() => sfx.boom(true), 250);
  shake = 28; flash = .9;
  const pts = 5000 * lvl * mult(); score += pts;
  texts.push({ x: b.x, y: b.y, s: 'JEFE DESTRUIDO  +' + pts.toLocaleString('es-ES'), life: 2.2, col: '#ffbe0b', size: 26 });
  ebullets.forEach(q => q.dead = true);
  dropPup(b.x - 40, b.y, 'P'); dropPup(b.x + 40, b.y, Math.random() < .5 ? '+' : 'B');
  boss = null;
}

// ---------- Jugador ----------
function pshoot() {
  const p = player, x = p.x, y = p.y - 20;
  const B = (dx, a, dmg = 1) => bullets.push({ x: x + dx, y, vx: Math.sin(a) * 760, vy: -Math.cos(a) * 760, dmg, r: 4 });
  switch (p.pow) {
    case 1: B(0, 0, 1.5); break;
    case 2: B(-7, 0); B(7, 0); break;
    case 3: B(0, 0); B(-11, 0); B(11, 0); break;
    case 4: B(-6, 0); B(6, 0); B(-13, -.14); B(13, .14); break;
    default: B(0, 0); B(-8, 0); B(8, 0); B(-14, -.16); B(14, .16); B(-17, -.34); B(17, .34);
  }
  sfx.shoot();
}
function hurt() {
  const p = player;
  if (p.inv > 0) return;
  if (p.shield > 0) {
    p.shield = 0; p.inv = 1.2; sfx.shield();
    rings.push({ x: p.x, y: p.y, r: 20, max: 120, life: .5, col: '#06d6a0' });
    ebullets.forEach(b => { if (d2(b, p) < 150 * 150) b.dead = true; });
    return;
  }
  p.lives--; p.pow = Math.max(1, p.pow - 1); p.inv = 2.6;
  explode(p.x, p.y, '#4cc9f0', 45, 300); sfx.hurt();
  shake = 16; flash = .45; chain = 0;
  ebullets.forEach(b => { b.dead = true; spark(b.x, b.y, b.col, 1); });
  if (p.lives <= 0) gameOver();
}
function bomb() {
  const p = player;
  if (state !== 'play' || p.bombs <= 0) return;
  p.bombs--; sfx.bomb(); flash = 1; shake = 22; p.inv = Math.max(p.inv, 1);
  rings.push({ x: p.x, y: p.y, r: 10, max: Math.max(W, H), life: .9, col: '#ff006e' });
  ebullets.forEach(b => { b.dead = true; spark(b.x, b.y, b.col, 1); });
  for (const e of enemies) if (!e.dead && e.y > -10) damage(e, 40);
  if (boss && !boss.entering) hitBoss(Math.ceil(boss.max * .08));
}
function gameOver() {
  state = 'over'; overT = 0;
  if (score > hi) { hi = score; newRecord = true; try { localStorage.setItem('vanguardia_hi', hi); } catch (e) {} }
}

// ---------- Power-ups ----------
const PUPS = {
  P: { col: '#ffbe0b', name: 'ARMA +' },
  S: { col: '#06d6a0', name: 'ESCUDO' },
  B: { col: '#ff006e', name: 'BOMBA +' },
  '+': { col: '#ff4d6d', name: 'VIDA +' }
};
function dropPup(x, y, k) {
  if (!k) { const r = Math.random(); k = r < .48 ? 'P' : r < .73 ? 'S' : r < .92 ? 'B' : '+'; }
  pups.push({ x, y, k, t: 0 });
}
function collect(u) {
  const p = player; sfx.power();
  if (u.k === 'P') { if (p.pow < 5) p.pow++; else { score += 1000; texts.push({ x: u.x, y: u.y - 20, s: '+1000', life: 1, col: '#ffbe0b', size: 16 }); } }
  if (u.k === 'S') p.shield = 1;
  if (u.k === 'B') p.bombs = Math.min(5, p.bombs + 1);
  if (u.k === '+') p.lives = Math.min(5, p.lives + 1);
  texts.push({ x: u.x, y: u.y, s: PUPS[u.k].name, life: 1.1, col: PUPS[u.k].col, size: 18 });
  rings.push({ x: u.x, y: u.y, r: 5, max: 60, life: .4, col: PUPS[u.k].col });
}

// ---------- Partículas ----------
function explode(x, y, col, n = 20, spd = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd, l = rand(.35, 1);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, col: Math.random() < .3 ? '#fff' : col, sz: rand(1.5, 4) });
  }
}
function spark(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 200), l = rand(.15, .35);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, col, sz: rand(1, 2.5) });
  }
}

// ---------- Actualización ----------
function update(dt) {
  t += dt;
  const starSpeed = state === 'play' ? 1 : .4;
  for (const s of stars) { s.y += s.s * 60 * dt * starSpeed; if (s.y > H) { s.y = -3; s.x = Math.random() * W; } }

  // Partículas y efectos (también en game over)
  const fr = Math.max(0, 1 - 2.5 * dt);
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fr; q.vy *= fr; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const r of rings) { r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 6); }
  rings = rings.filter(r => r.life > 0);
  for (const x of texts) { x.y -= 40 * dt; x.life -= dt; }
  texts = texts.filter(x => x.life > 0);
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 2.2);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  if (state === 'over') {
    overT += dt;
    for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    return;
  }
  if (state !== 'play') return;

  const p = player;
  // Movimiento con teclado
  const mx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const my = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  const sp = mx && my ? 400 / Math.SQRT2 : 400;
  p.x = clamp(p.x + mx * sp * dt, 20, W - 20);
  p.y = clamp(p.y + my * sp * dt, 40, H - 30);
  const tgt = clamp((p.x - p.px) / (dt * 400 || 1), -1, 1);
  p.tilt += (tgt - p.tilt) * Math.min(1, dt * 10); p.px = p.x;
  p.inv = Math.max(0, p.inv - dt);

  // Disparo automático
  p.fire -= dt;
  if (p.fire <= 0) { pshoot(); p.fire = .11; }

  // Cadena de combos
  if (chainT > 0) { chainT -= dt; if (chainT <= 0) chain = 0; }

  // Oleadas
  waveClock += dt;
  for (let i = spawnQ.length - 1; i >= 0; i--) if (spawnQ[i].at <= waveClock) { const f = spawnQ[i].f; spawnQ.splice(i, 1); f(); }
  if (!spawnQ.length && !enemies.length && !boss) {
    waveGap += dt;
    if (waveGap > 1.6) {
      waveGap = 0;
      const bonus = wave * 250; score += bonus;
      texts.push({ x: W / 2, y: H * .55, s: 'OLEADA SUPERADA  +' + bonus.toLocaleString('es-ES'), life: 1.6, col: '#06d6a0', size: 20 });
      nextWave();
    }
  }

  // Movimiento de entidades
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true; }
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y > H + 20 || b.y < -40 || b.x < -20 || b.x > W + 20) b.dead = true; }
  for (const e of enemies) updEnemy(e, dt);
  if (boss) updBoss(dt);
  for (const u of pups) { u.t += dt; u.y += 75 * dt; u.x += Math.sin(u.t * 3) * 30 * dt; if (u.y > H + 30) u.dead = true; }

  // Colisiones: balas del jugador
  for (const b of bullets) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = e.r + b.r;
      if (d2(b, e) < rr * rr) { b.dead = true; damage(e, b.dmg, b.x, b.y); sfx.hit(); break; }
    }
    if (!b.dead && boss && !boss.entering && inBoss(b.x, b.y)) { b.dead = true; hitBoss(b.dmg, b.x, b.y); }
  }
  // Colisiones: jugador
  if (p.inv <= 0) {
    for (const b of ebullets) if (!b.dead && d2(b, p) < (b.r + 6) ** 2) { b.dead = true; hurt(); break; }
  }
  if (p.inv <= 0 && state === 'play') {
    for (const e of enemies) if (!e.dead && d2(e, p) < (e.r + 12) ** 2) { kill(e); hurt(); break; }
  }
  if (p.inv <= 0 && state === 'play' && boss && inBoss(p.x, p.y, 8)) hurt();
  for (const u of pups) if (!u.dead && d2(u, p) < 30 * 30) { u.dead = true; collect(u); }

  bullets = bullets.filter(b => !b.dead);
  ebullets = ebullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  pups = pups.filter(u => !u.dead);
}

// ---------- Dibujo ----------

function drawPlayer() {

// --- Piezas para las naves enemigas (todas miran hacia abajo: morro en +y) ---
function sym(pts) { // traza un casco simétrico a partir de su mitad derecha
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) ctx.lineTo(p[0], p[1]);

}
function eFlame(x, y, w, len, col) { // llama de motor hacia arriba

  const g = ctx.createLinearGradient(0, y, 0, y - l);
  g.addColorStop(0, '#fff'); g.addColorStop(.25, col); g.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.beginPath(); ctx.moveTo(x - w, y); ctx.lineTo(x, y - l); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

function eEye(x, y, rx, ry, col) { // cabina / ojo brillante

  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.85)';

}
function metal(hit, w) {

function hull(pts, hit, w, col, lw = 1.6) {

const RED = '#ff2a2a';

function drawEnemy(e) {

      lines('rgba(0,0,0,.65)', [[0, 8, 28, 8], [0, -8, 30, -8], [12, 17, 12, -22]], 1.4);

}

function drawBanner() {

  txt(banner.txt, W / 2, H * .38, Math.max(30, 54 * s), '#fff', 'center', banner.col, 900);
  txt(banner.sub, W / 2, H * .38 + Math.max(34, 48 * s), Math.max(13, 18 * s), banner.col, 'center', null, 700);
  ctx.globalAlpha = 1;
}
function overlay(alpha) { ctx.fillStyle = `rgba(4,1,15,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawMenu() {
  const s = Math.min(1, W / 720), cy = H * .3;
  const g = ctx.createLinearGradient(W / 2 - 320 * s, 0, W / 2 + 320 * s, 0);
  g.addColorStop(0, '#4cc9f0'); g.addColorStop(.5, '#f72585'); g.addColorStop(1, '#ffbe0b');
  txt('VANGUARDIA', W / 2, cy, 76 * s, g, 'center', '#f72585', 900);
  txt('ESTELAR', W / 2, cy + 72 * s, 76 * s, g, 'center', '#4cc9f0', 900);
  txt('Defiende la galaxia · Sobrevive a las oleadas · Derrota a los jefes', W / 2, cy + 132 * s, Math.max(12, 16 * s), '#a9b8dd', 'center', null, 600);

  const ly = H * .58, lh = Math.max(20, 26 * s), fs = Math.max(12, 15 * s);
  const lines = isTouch
    ? ['Arrastra el dedo para mover la nave', 'Disparo automático', 'Botón BOMBA: limpia la pantalla']
    : ['Mover: Flechas / WASD  ·  o arrastra con el ratón', 'Disparo automático  ·  Bomba: X / B / Shift', 'Pausa: P / Esc  ·  Sonido: M'];
  lines.forEach((l, i) => txt(l, W / 2, ly + i * lh, fs, '#dfe7ff', 'center', null, 600));

  ctx.globalAlpha = .55 + Math.sin(t * 4) * .45;
  txt(isTouch ? 'TOCA PARA EMPEZAR' : 'PULSA ESPACIO O HAZ CLIC PARA EMPEZAR', W / 2, H * .78, Math.max(14, 20 * s), '#ffbe0b', 'center', '#ff8800', 900);
  ctx.globalAlpha = 1;
  if (hi) txt('RÉCORD: ' + hi.toLocaleString('es-ES'), W / 2, H * .84, Math.max(12, 15 * s), '#8fa3c8', 'center', null, 700);

  // Leyenda de power-ups
  const keysP = Object.keys(PUPS), gap = Math.min(150, (W - 40) / 4), x0 = W / 2 - gap * 1.5;
  keysP.forEach((k, i) => {
    drawPup({ x: x0 + i * gap, y: H * .91, k, t: t });
    txt(PUPS[k].name, x0 + i * gap, H * .91 + 26, 10, PUPS[k].col, 'center', null, 800);
  });
  drawShip(W / 2 + Math.sin(t * 1.3) * 60, H * .68 + Math.sin(t * 2.1) * 6, Math.cos(t * 1.3) * .8, 1.1);
}

function draw() {
  ctx.drawImage(bg, 0, 0, W, H);
  for (const s of stars) {
    ctx.fillStyle = s.l === 0 ? '#3d4466' : s.l === 1 ? '#8b95c9' : '#ffffff';
    const len = state === 'play' ? s.l * 2.5 : 0;
    ctx.fillRect(s.x, s.y, s.l * .7 + 1, s.l * .7 + 1 + len);
  }

  if (state === 'menu') { drawFx(); drawMenu(); return; }

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  for (const u of pups) drawPup(u);
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();
  if (state !== 'over') drawPlayer();
  drawBullets();
  drawFx();
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .55})`; ctx.fillRect(0, 0, W, H); }

  if (state !== 'over') { hud(); drawBanner(); }

  if (state === 'pause') {
    overlay(.6);
    txt('PAUSA', W / 2, H * .42, 60, '#fff', 'center', '#4cc9f0', 900);
    txt(isTouch ? 'Toca para continuar' : 'Pulsa P, Esc o haz clic para continuar', W / 2, H * .42 + 50, 16, '#a9b8dd', 'center', null, 600);
  }
  if (state === 'over') {
    overlay(Math.min(.7, overT * .7));
    const s = Math.min(1, W / 600);
    txt('FIN DE LA PARTIDA', W / 2, H * .32, Math.max(32, 58 * s), '#fff', 'center', '#f72585', 900);
    txt(score.toLocaleString('es-ES'), W / 2, H * .45, Math.max(40, 64 * s), '#ffbe0b', 'center', '#ff8800', 900);
    txt('Oleada alcanzada: ' + wave, W / 2, H * .45 + 50, 16, '#a9b8dd', 'center', null, 700);
    if (newRecord) {
      ctx.globalAlpha = .6 + Math.sin(t * 6) * .4;
      txt('★ ¡NUEVO RÉCORD! ★', W / 2, H * .45 + 84, 22, '#06d6a0', 'center', '#06d6a0', 900);
      ctx.globalAlpha = 1;
    } else txt('Récord: ' + hi.toLocaleString('es-ES'), W / 2, H * .45 + 84, 15, '#8fa3c8', 'center', null, 700);
    if (overT > 1) {
      ctx.globalAlpha = .55 + Math.sin(t * 4) * .45;
      txt(isTouch ? 'TOCA PARA REINTENTAR' : 'PULSA ESPACIO O HAZ CLIC PARA REINTENTAR', W / 2, H * .72, Math.max(14, 19 * s), '#fff', 'center', '#4cc9f0', 900);
      ctx.globalAlpha = 1;
    }
  }
}

// ---------- Bucle principal ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
