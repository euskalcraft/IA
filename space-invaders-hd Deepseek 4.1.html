<body>
<div id="stage">

</div>
<script>
/* ================= Space Invaders Neón HD ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=600,Q=Math.min(2,Math.max(1,window.devicePixelRatio||1));
cv.width=W*Q;cv.height=H*Q;ctx.scale(Q,Q);
function fit(){const s=Math.min((innerWidth-40)/W,(innerHeight-90)/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
// ---- utilidades ----
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
let parts=[],pops=[],shakeT=0,shakeM=0;
function burst(x,y,color,n,spd,life){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(spd*.2,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:rnd(life*.5,life),t:0,c:color,r:rnd(1.5,3.6)});}}
function sparks(x,y,color,n){for(let i=0;i<n;i++){const a=rnd(-Math.PI*.9,-Math.PI*.1),s=rnd(40,190);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.6),t:0,c:color,r:rnd(1,2.4),g:260});}}
function pop(x,y,txt,c){pops.push({x,y,txt,c,t:0,life:1.1});}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t);}
// ---- audio ----
let ac=null,muted=(localStorage.getItem('si_hd_mute')==='1');
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f0,f1,dur,type,vol,delay){const a=audio();if(!a||muted)return;const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.02);}
function noise(dur,vol,f0){const a=audio();if(!a||muted)return;const n=Math.round(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=f0||2600;s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}
const NOTE=[72,60,86,54];
const snd={
 fire:()=>{tone(1150,260,.10,'square',.11);tone(2300,900,.05,'sawtooth',.03);},
 kill:()=>{noise(.18,.30,3200);tone(420,70,.16,'sawtooth',.16);},
 shield:()=>{noise(.06,.12,1400);tone(300,180,.06,'triangle',.05);},
 step:n=>tone(NOTE[n%4],NOTE[(n+1)%4],.10,'square',.10),
 ufoOn:()=>{const a=audio();if(!a||muted)return;snd._o=a.createOscillator();snd._g=a.createGain();snd._o.type='square';snd._o.frequency.value=760;const l=a.createOscillator(),lg=a.createGain();l.type='sine';l.frequency.value=15;lg.gain.value=340;l.connect(lg).connect(snd._o.frequency);snd._g.gain.value=.045;snd._o.connect(snd._g).connect(a.destination);snd._o.start();l.start();snd._l=l;},
 ufoOff:()=>{try{if(snd._o){snd._o.stop();snd._o.disconnect();}if(snd._l)snd._l.stop();}catch(e){}},
 boom:()=>{noise(.5,.36,1800);tone(240,28,.5,'sawtooth',.26);},
 ufoboom:()=>{noise(.45,.34,2400);tone(180,40,.45,'square',.22);tone(1400,200,.3,'sawtooth',.12);},
 wave:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.16,'triangle',.12,i*.09));},
 over:()=>{[440,330,260,160].forEach((f,i)=>tone(f,f*.6,.35,'sawtooth',.16,i*.18));}
};
/* ================= sprites ================= */
const CELL=3,GLOW=9;
function bake(rows,c1,c2){
const w=rows[0].length*CELL,h=rows.length*CELL,p=GLOW;
const c=document.createElement('canvas');c.width=w+p*2;c.height=h+p*2;const g=c.getContext('2d');
const grad=g.createLinearGradient(0,p,0,p+h);grad.addColorStop(0,c1);grad.addColorStop(1,c2);
g.shadowColor=c1;g.shadowBlur=GLOW;g.fillStyle=grad;
for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++)if(rows[y][x]==='X')g.fillRect(p+x*CELL+.4,p+y*CELL+.4,CELL-.8,CELL-.8);
g.shadowColor=c1;g.shadowBlur=GLOW*2;g.globalAlpha=.35;g.globalCompositeOperation='lighter';
for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++)if(rows[y][x]==='X')g.fillRect(p+x*CELL+1,p+y*CELL+1,CELL-2,CELL-2);
return c;
}
const R={
 squid:["...XX...","..XXXX..",".XXXXXX.","XXXXXXXX",".XXXXXX.","..X..X..","",""],
 squidB:["...XX...","..XXXX..",".XXXXXX.","XXXXXXXX",".XXXXXX.",".X....X.","",""],
 crab:["...XX...XX.",".XXXXXXXXX.","XXXXXXXXXXX","XXXXXXXXXXX","X.XXXXXXX.X","","",""],
 crabB:["...XX...XX.",".XXXXXXXXX.","XXXXXXXXXXX","XXXXXXXXXXX","..XXXXXXX..","","",""],
 octo:["...XXXXXX...",".XXXXXXXXXX.","XXXXXXXXXXXX","X.XXXXXXXX.X","XX.XXXXXX.XX","","",""],
 octoB:["...XXXXXX...",".XXXXXXXXXX.","XXXXXXXXXXXX","X.XXXXXXXX.X",".XX.XX.XX..","","",""],
 ufo:[".....XXXX......","....XXXXXX.....","...XXXXXXXX....",".XX.XXXXXXXX.XX"],
 ship:[".......X.......","......XXX......",".....XXXXX.....","XXXXXXXXXXXXX","XXXXXXXXXXXXX","XXXXXXXXXXXXX","XXXXXXXXXXXXX","XXXXXXXXXXXXX"]
};
const SPR={
 squid:{a:bake(R.squid,'#9ffcff','#0a9dff'),b:bake(R.squidB,'#9ffcff','#0a9dff'),w:8*CELL,h:8*CELL,pts:30},
 crab:{a:bake(R.crab,'#ff9ae4','#c026d3'),b:bake(R.crabB,'#ff9ae4','#c026d3'),w:11*CELL,h:8*CELL,pts:20},
 octo:{a:bake(R.octo,'#c6ff86','#22c55e'),b:bake(R.octoB,'#c6ff86','#22c55e'),w:12*CELL,h:8*CELL,pts:10},
 ufo:bake(R.ufo,'#ffcf6b','#ff4d4d'),ufoW:16*CELL,
 ship:bake(R.ship,'#e8fffb','#22e6c8'),shipW:13*CELL
};
/* ================= blindajes ================= */
const BWC=40,BHC=24,BCELL=2,BW=BWC*BCELL,BH=BHC*BCELL;
function shieldGrid(){const g=[];for(let r=0;r<BHC;r++){g[r]=[];for(let c=0;c<BWC;c++){let on;if(r===0)on=c>=6&&c<=33;else if(r===1)on=c>=5&&c<=34;else if(r===2)on=c>=4&&c<=35;else if(r===3)on=c>=3&&c<=36;else if(r===4)on=c>=2&&c<=37;else if(r===5)on=c>=1&&c<=38;else on=r<18||c<14||c>25;g[r][c]=on?1:0;}}return g;}
function bakeShield(b){const g2=b.c.getContext('2d');g2.clearRect(0,0,BW,BH);
for(let r=0;r<BHC;r++)for(let c=0;c<BWC;c++)if(b.g[r][c]){
const x=c*BCELL,y=r*BCELL,hue=96+r*1.6;g2.fillStyle='hsla('+hue+',72%,'+(52+r*.5)+'%,.92)';g2.fillRect(x,y,BCELL-.2,BCELL-.2);
if((r%3===0)&&(c%3===0)){g2.fillStyle='hsla(150,90%,80%,.25)';g2.fillRect(x,y,BCELL-.2,BCELL-.2);}}
g2.globalCompositeOperation='lighter';g2.fillStyle='rgba(90,255,190,.045)';g2.fillRect(0,0,BW,BH);g2.globalCompositeOperation='source-over';b.dir=false;}
function mkShield(x,y){const b={x,y,g:shieldGrid()};b.c=document.createElement('canvas');b.c.width=BW;b.c.height=BH;b.dir=true;return b;}
function shieldAt(px,py){for(const b of shields){const c=Math.floor((px-b.x)/BCELL),r=Math.floor((py-b.y)/BCELL);if(c>=0&&c<BWC&&r>=0&&r<BHC&&b.g[r][c])return{b,r,c};}return null;}
const CRAT=[[0,0],[-1,0],[1,0],[0,-1],[-1,-1],[1,-1],[2,0],[-2,0],[0,1],[2,-1],[-2,-1],[1,-2],[-1,-2]];
function erode(b,r,c){for(const[dr,dc]of CRAT){const rr=r+dr,cc=c+dc;if(cc>=0&&cc<BWC&&rr>=0&&rr<BHC&&(Math.abs(dr)<2||Math.random()<.5))b.g[rr][cc]=0;}b.dir=true;burst(b.x+c*BCELL,b.y+r*BCELL,'#4ade80',5,80,.35);snd.shield();}
/* ================= estado ================= */
let mode='title',score=0,hiScore=+(localStorage.getItem('si_hd_hi')||0),lives=3,round=1;
let inv=[],dir=1,stepT=0,animF=0,animT=0,pBuls=[],iBuls=[],shootT=0,shields=[],stepN=0,msg='',msgT=0,paused=false;
let drops=[],fireCd=0,rapidT=0,tripleT=0,touchFire=false,crt=(localStorage.getItem('si_hd_crt')!=='0');
let scores=[];try{scores=JSON.parse(localStorage.getItem('si_hd_scores')||'[]')||[];}catch(e){scores=[];}
const player={x:W/2-SPR.shipW/2,y:556};
const ufo={on:false,x:-60,dir:1,t:0,pts:50,w:SPR.ufoW,lights:0};
function aliveCount(){let n=0;for(const i of inv)if(i.alive)n++;return n;}
function resetRound(r){round=r;inv=[];
const kinds=['squid','crab','crab','octo','octo'];
for(let row=0;row<5;row++)for(let col=0;col<11;col++){const k=kinds[row],s=SPR[k];
inv.push({x:22+col*40,y:110+row*34,w:s.w,h:s.h,k,alive:true,pts:s.pts,ph:Math.random()*6.28});}
dir=1;stepT=0;pBuls=[];iBuls=[];shootT=1.6;ufo.on=false;snd.ufoOff();ufo.t=9+Math.random()*7;
lives=3;player.x=W/2-SPR.shipW/2;shields=[32,144,256,368].map(x=>mkShield(x,470));parts=[];pops=[];
drops=[];rapidT=0;tripleT=0;fireCd=0;msg='OLEADA '+r;msgT=1.2;}
/* ================= entrada ================= */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
if(e.code==='Enter'&&mode!=='play'&&mode!=='clear'){audio();score=0;resetRound(mode==='over'?round+1:1);mode='play';}
if(e.code==='KeyM'){muted=!muted;try{localStorage.setItem('si_hd_mute',muted?'1':'0');}catch(x){}}
if(e.code==='KeyC'){crt=!crt;try{localStorage.setItem('si_hd_crt',crt?'1':'0');}catch(x){}}
if((e.code==='KeyP'||e.code==='Escape')&&mode==='play')paused=!paused;});
addEventListener('keyup',e=>{keys[e.code]=false;});
let drag=null;
function startGame(){audio();paused=false;score=0;resetRound(mode==='over'?round+1:1);mode='play';}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();
if(mode==='title'||mode==='over'){startGame();return;}
if(mode==='play'&&!paused){drag={cx:e.clientX,px:player.x};touchFire=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}}});
cv.addEventListener('pointermove',e=>{if(!drag||mode!=='play')return;const r=cv.getBoundingClientRect();
player.x=clamp(drag.px+(e.clientX-drag.cx)*(W/r.width),10,W-10-SPR.shipW);});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;touchFire=false;}));
/* ================= lógica ================= */
function saveScore(sv){scores.push(sv);scores.sort((a,b)=>b-a);scores=scores.slice(0,5);
try{localStorage.setItem('si_hd_scores',JSON.stringify(scores));}catch(e){}}
function gameOver(){lives=0;mode='over';snd.over();snd.ufoOff();ufo.on=false;
if(score>hiScore){hiScore=score;try{localStorage.setItem('si_hd_hi',hiScore);}catch(e){}}
if(score>0)saveScore(score);}
function hurtPlayer(){snd.boom();shake(11,.55);burst(player.x+SPR.shipW/2,player.y+10,'#7dfcff',40,260,.9);lives--;
if(lives<=0)gameOver();else{player.x=W/2-SPR.shipW/2;iBuls=[];msg='¡CUIDADO!';msgT=1;}}
const DROPS=[['R','#ffd166'],['T','#7df9ff'],['S','#8affc1'],['+','#ff6b8a']];
function dropSpawn(x,y){const roll=Math.random(),t=roll<.34?0:roll<.64?1:roll<.9?2:3;drops.push({x,y,vy:115,ph:0,t:DROPS[t][0],c:DROPS[t][1]});}
function applyDrop(d){
if(d.t==='R'){rapidT=8;pop(d.x,d.y-6,'RÁPIDO',d.c);}
else if(d.t==='T'){tripleT=8;pop(d.x,d.y-6,'TRIPLE',d.c);}
else if(d.t==='S'){for(const b of shields){b.g=shieldGrid();b.dir=true;burst(b.x+BW/2,b.y+BH/2,'#8affc1',26,210,.8);}pop(d.x,d.y-6,'BLINDAJES',d.c);}
else{lives=Math.min(5,lives+1);pop(d.x,d.y-6,'+1 VIDA',d.c);}
burst(d.x,d.y,d.c,22,210,.6);tone(520,1040,.14,'triangle',.12);tone(1040,1560,.12,'triangle',.09);shake(3,.15);}
function killInv(i){i.alive=false;score+=i.pts;const s=SPR[i.k];
if(drops.length<2&&Math.random()<.075)dropSpawn(i.x+s.w/2,i.y+s.h/2);
burst(i.x+s.w/2,i.y+s.h/2,i.k==='squid'?'#9ffcff':i.k==='crab'?'#ff9ae4':'#c6ff86',22,220,.6);
pop(i.x+s.w/2,i.y,'+'+i.pts,i.k==='squid'?'#9ffcff':i.k==='crab'?'#ff9ae4':'#c6ff86');
shake(3,.14);snd.kill();
if(aliveCount()===0){mode='clear';msgT=2.2;snd.wave();snd.ufoOff();ufo.on=false;}}
function update(dt){
if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeM=0;}
for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.t+=dt;if(p.t>=p.life){parts.splice(k,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;}
for(let k=pops.length-1;k>=0;k--){pops[k].t+=dt;if(pops[k].t>=pops[k].life)pops.splice(k,1);}
if(msgT>0){msgT-=dt;if(mode==='clear'&&msgT<=0){resetRound(round+1);mode='play';}return;}
if(mode!=='play'||paused)return;
// jugador
const sp=230*dt;
if(keys.ArrowLeft||keys.KeyA)player.x-=sp;
if(keys.ArrowRight||keys.KeyD)player.x+=sp;
player.x=clamp(player.x,10,W-10-SPR.shipW);
fireCd-=dt;if(rapidT>0)rapidT-=dt;if(tripleT>0)tripleT-=dt;
if((keys.Space||touchFire)&&fireCd<=0&&(rapidT>0||pBuls.length===0)){
const bx=player.x+SPR.shipW/2-1.5;
if(tripleT>0)pBuls.push({x:bx-15,y:player.y-6,tr:[]},{x:bx,y:player.y-9,tr:[]},{x:bx+15,y:player.y-6,tr:[]});
else pBuls.push({x:bx,y:player.y-8,tr:[]});
fireCd=rapidT>0?.17:.05;snd.fire();sparks(bx,player.y+4,'#9ffcff',5);}
// paso de invasores
const n=aliveCount();stepT+=dt;
const interval=.028+.25*(n/55);
if(stepT>=interval&&n>0){stepT=0;animF^=1;snd.step(stepN++);
const edge=inv.some(i=>i.alive&&(dir>0?i.x+i.w+4>W-10:i.x-4<10));
if(edge){dir*=-1;for(const i of inv)if(i.alive)i.y+=10;
if(inv.some(i=>i.alive&&i.y+i.h>=player.y-2)){gameOver();return;}}
else for(const i of inv)if(i.alive)i.x+=dir*4;}
// bala del jugador
for(let bi=pBuls.length-1;bi>=0;bi--){const b=pBuls[bi];let rem=680*dt,gone=false;
while(rem>0&&!gone){const st=Math.min(4,rem);rem-=st;b.y-=st;
b.tr.push({x:b.x,y:b.y});if(b.tr.length>8)b.tr.shift();
if(ufo.on&&b.x>ufo.x-2&&b.x<ufo.x+SPR.ufoW+2&&b.y>92&&b.y<132){score+=ufo.pts;pop(ufo.x+SPR.ufoW/2,110,'+'+ufo.pts,'#ffcf6b');burst(ufo.x+SPR.ufoW/2,112,'#ff9a4d',46,300,.9);shake(7,.35);snd.ufoboom();snd.ufoOff();ufo.on=false;gone=true;break;}
for(const i of inv)if(i.alive&&b.x>i.x-1&&b.x<i.x+i.w+1&&b.y>i.y-1&&b.y<i.y+i.h+1){killInv(i);gone=true;break;}
if(gone)break;
const sh=shieldAt(b.x,b.y);if(sh){erode(sh.b,sh.r,sh.c);gone=true;break;}
if(b.y<92)gone=true;}
if(gone)pBuls.splice(bi,1);}
// disparo invasor
shootT-=dt;const maxB=Math.min(6,3+Math.floor(round/2));
if(shootT<=0&&iBuls.length<maxB){const cols={};for(const i of inv)if(i.alive)(cols[i.x]=cols[i.x]||[]).push(i);
const ks=Object.keys(cols);if(ks.length){const c=ks[ri(0,ks.length-1)],lst=cols[c].sort((a,b)=>b.y-a.y)[0];
iBuls.push({x:lst.x+lst.w/2,y:lst.y+lst.h,vy:150+round*16});sparks(lst.x+lst.w/2,lst.y+lst.h,'#ff9ae4',4);}
shootT=Math.max(.28,.55+Math.random()*.85-round*.035);}
// balas invasoras
for(let k=iBuls.length-1;k>=0;k--){const b=iBuls[k];let rem=b.vy*dt,hit=false;
while(rem>0&&!hit){const st=Math.min(3,rem);rem-=st;b.y+=st;
const sh=shieldAt(b.x,b.y);if(sh){erode(sh.b,sh.r,sh.c);hit=true;break;}
if(b.x>player.x-2&&b.x<player.x+SPR.shipW+2&&b.y>player.y-2&&b.y<player.y+22){hurtPlayer();hit=true;break;}
if(b.y>H-30)hit=true;}
if(hit)iBuls.splice(k,1);}
// power-ups
for(let k=drops.length-1;k>=0;k--){const d=drops[k];d.y+=d.vy*dt;d.ph+=dt*5;
if(d.x>player.x-8&&d.x<player.x+SPR.shipW+8&&d.y>player.y-8&&d.y<player.y+26){applyDrop(d);drops.splice(k,1);continue;}
if(d.y>H-16)drops.splice(k,1);}
// OVNI
ufo.t-=dt;ufo.lights+=dt;
if(!ufo.on&&ufo.t<=0){ufo.on=true;ufo.dir=Math.random()<.5?1:-1;ufo.x=ufo.dir>0?-70:W+10;ufo.pts=[50,80,90,100][ri(0,3)];snd.ufoOn();ufo.t=10+Math.random()*8;}
if(ufo.on){ufo.x+=ufo.dir*115*dt;if(ufo.x<-80||ufo.x>W+20){ufo.on=false;snd.ufoOff();}}
}
/* ================= fondo y ayudas de dibujo ================= */
const stars=[];
(function(){const cfg=[[70,.22,1.3,1],[45,.4,1.9,.7],[26,.62,2.6,.5]];
for(const [cnt,sp,rad,al] of cfg)for(let i=0;i<cnt;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.6,rad),sp,al:al*rnd(.6,1),ph:Math.random()*6.28});})();
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const g=bg.getContext('2d');g.fillStyle='#04060a';g.fillRect(0,0,W,H);
let rg=g.createRadialGradient(W*.3,H*.25,10,W*.3,H*.25,380);rg.addColorStop(0,'rgba(0,120,150,.16)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
rg=g.createRadialGradient(W*.75,H*.6,10,W*.75,H*.6,420);rg.addColorStop(0,'rgba(120,0,140,.14)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
rg=g.createRadialGradient(W*.5,H*.95,10,W*.5,H*.95,320);rg.addColorStop(0,'rgba(0,90,70,.14)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);})();
const scan=document.createElement('canvas');scan.width=1;scan.height=4;
(function(){const g=scan.getContext('2d');g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,0,1,2);})();
const scanPat=ctx.createPattern(scan,'repeat');
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
(function(){const g=vig.getContext('2d');const rg=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.78);rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=rg;g.fillRect(0,0,W,H);})();
function glowText(s,x,y,font,color,align,blur){
ctx.save();ctx.font=font;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
ctx.shadowColor=color;ctx.shadowBlur=blur||12;ctx.fillStyle=color;ctx.fillText(s,x,y);
ctx.shadowBlur=0;ctx.fillStyle='#ffffff';ctx.globalAlpha=.55;ctx.fillText(s,x,y);ctx.restore();}
function label(s,x,y,font,color,align,blur){
ctx.save();ctx.font=font;ctx.textAlign=align||'left';ctx.shadowColor=color;ctx.shadowBlur=blur==null?8:blur;
ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawSpr(im,x,y,sc){const s=sc||1;ctx.drawImage(im,x-GLOW*s,y-GLOW*s,im.width*s,im.height*s);}
function dot(x,y,r,color,alpha){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=alpha==null?1:alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.restore();}
/* ================= render ================= */
let T=0;
function render(dt){
T+=dt;ctx.save();
if(shakeT>0){const m=shakeM*Math.min(1,shakeT*4);ctx.translate(rnd(-m,m),rnd(-m,m));}
ctx.clearRect(-20,-20,W+40,H+40);
ctx.drawImage(bg,0,0);
// estrellas
for(const s of stars){s.y+=s.sp*dt*22;if(s.y>H)s.y-=H;
const tw=.55+.45*Math.sin(T*2.4+s.ph);dot(s.x,s.y,s.r,'#cfefff',s.al*tw);}
if(mode==='title'){drawTitle();ctx.restore();return;}
// blindajes
for(const b of shields){if(b.dir)bakeShield(b);ctx.save();ctx.shadowColor='#34d399';ctx.shadowBlur=10;ctx.drawImage(b.c,b.x,b.y);ctx.restore();}
// invasores
for(const i of inv){if(!i.alive)continue;const s=SPR[i.k],bob=Math.sin(T*2.2+i.ph)*1.6;
ctx.save();ctx.globalAlpha=.86+.14*Math.sin(T*3+i.ph);
drawSpr(animF?s.b:s.a,i.x,bob+i.y);ctx.restore();}
// OVNI
if(ufo.on){const y=110;drawSpr(SPR.ufo,ufo.x,y);
for(let k=0;k<3;k++){const on=(Math.floor(ufo.lights*8)+k)%3===0;dot(ufo.x+12+k*12,y+26,2.4,on?'#ffe08a':'#ff7a3d',on?1:.5);}}
// balas
for(const b of pBuls){ctx.save();ctx.globalCompositeOperation='lighter';
for(let k=0;k<b.tr.length;k++){const t2=b.tr[k],a=(k+1)/b.tr.length;dot(t2.x,t2.y,2.2*a,'#9ffcff',a*.5);}
ctx.restore();dot(b.x,b.y,4,'#eaffff',1);dot(b.x,b.y,8,'#37d6ff',.5);}
for(const d of drops){const pu=1+.12*Math.sin(d.ph*2);
ctx.save();ctx.shadowColor=d.c;ctx.shadowBlur=16;ctx.fillStyle='rgba(6,16,20,.92)';
rr(d.x-11,d.y-11,22,22,7);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=d.c;ctx.stroke();ctx.restore();
label(d.t,d.x,d.y+6,'bold 15px ui-monospace,Consolas,monospace',d.c,'center',10);
ctx.save();ctx.globalAlpha=.3;ctx.strokeStyle=d.c;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(d.x,d.y,16*pu,d.ph,d.ph+4.2);ctx.stroke();ctx.restore();}
for(const b of iBuls){dot(b.x,b.y,3.4,'#ffd0f2',1);dot(b.x,b.y,7.5,'#ff4fd8',.55);}
// partículas y textos flotantes
ctx.save();ctx.globalCompositeOperation='lighter';
for(const p of parts){const a=1-p.t/p.life;dot(p.x,p.y,p.r*p.life<=0?0:p.r,p.c,a*.95);}
ctx.restore();
for(const p of pops){const a=1-p.t/p.life;ctx.save();ctx.globalAlpha=a;label(p.txt,p.x,p.y-18*(1-a)-6,'bold 15px ui-monospace,Consolas,monospace',p.c,'center',8);ctx.restore();}
// nave
{const fl=6+Math.sin(T*30)*3;
ctx.save();ctx.globalCompositeOperation='lighter';dot(player.x+SPR.shipW/2,player.y+26,7+fl,'#37d6ff',.55);ctx.restore();
drawSpr(SPR.ship,player.x,player.y-6+Math.sin(T*2)*1.2);}
// suelo
ctx.save();ctx.shadowColor='#22e6c8';ctx.shadowBlur=14;ctx.fillStyle='rgba(34,230,200,.85)';ctx.fillRect(0,584,W,2);ctx.restore();
// HUD
hud();ctx.restore();
overlayEffects();
if(msgT>0&&msg&&mode==='play')glowText(msg,W/2,H/2+46,'bold 26px ui-monospace,Consolas,monospace','#9ffcff','center',18);
if(mode==='clear')glowText('RONDA COMPLETADA',W/2,H/2,'bold 30px ui-monospace,Consolas,monospace','#c6ff86','center',22);
if(mode==='over')drawOver();
if(paused)drawPause();
}
/* ================= HUD y pantallas ================= */
function panel(x,y,w,h,c){ctx.save();ctx.shadowColor=c||'#22e6c8';ctx.shadowBlur=16;rr(x,y,w,h,10);
ctx.fillStyle='rgba(6,20,26,.6)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=c||'rgba(34,230,200,.6)';ctx.stroke();ctx.restore();}
function hud(){
panel(10,8,W-20,46);
label('SCORE',24,26,'bold 11px ui-monospace,Consolas,monospace','#6fb7c4','left',6);
label(String(score).padStart(6,'0'),24,46,'bold 20px ui-monospace,Consolas,monospace','#9ffcff','left',12);
label('HI-SCORE',W/2,26,'bold 11px ui-monospace,Consolas,monospace','#b58ad8','center',6);
label(String(hiScore).padStart(6,'0'),W/2,46,'bold 20px ui-monospace,Consolas,monospace','#e0b3ff','center',12);
label('WAVE',W-24,26,'bold 11px ui-monospace,Consolas,monospace','#8ad8a4','right',6);
label(String(round),W-24,46,'bold 20px ui-monospace,Consolas,monospace','#c6ff86','right',12);
for(let i=0;i<Math.max(0,lives-1);i++){ctx.save();ctx.globalAlpha=.45;drawSpr(SPR.ship,20+i*26,591,.42);ctx.restore();}
let bx2=24;
if(rapidT>0){chip(bx2,62,'RÁPIDO',rapidT/8,'#ffd166');bx2+=86;}
if(tripleT>0)chip(bx2,62,'TRIPLE',tripleT/8,'#7df9ff');
}
function chip(x,y,txt,frac,c){ctx.save();label(txt,x,y+10,'bold 11px ui-monospace,Consolas,monospace',c,'left',6);
ctx.fillStyle='rgba(255,255,255,.16)';rr(x,y+15,72,4,2);ctx.fill();ctx.fillStyle=c;rr(x,y+15,Math.max(2,72*frac),4,2);ctx.fill();ctx.restore();}
function drawTitle(){
const cx=W/2,bob=Math.sin(T*2)*4;
glowText('SPACE',cx,168+bob,'bold 56px ui-monospace,Consolas,monospace','#9ffcff','center',26);
glowText('INVADERS',cx,224+bob,'bold 56px ui-monospace,Consolas,monospace','#ff9ae4','center',26);
glowText('N E Ó N   H D',cx,252+bob,'bold 15px ui-monospace,Consolas,monospace','#8ad8a4','center',12);
const ly=318;const kinds=[['squid','30'],['crab','20'],['octo','10']];
let y=ly;for(const[k,p]of kinds){const s=SPR[k];drawSpr((Math.floor(T*2.5)%2)?s.b:s.a,cx-100,y-8);
label('= '+p+' PTS',cx-70,y,'bold 17px ui-monospace,Consolas,monospace',k==='squid'?'#9ffcff':k==='crab'?'#ff9ae4':'#c6ff86','left',10);y+=46;}
for(let i=0;i<8;i++){const x=((T*46+i*58)%(W+120))-60;drawSpr((Math.floor(T*4)%2)?SPR.octo.b:SPR.octo.a,x,472+Math.sin(T*3+i)*4,.8);}
if(Math.floor(T*2)%2===0)label('PULSA ENTER PARA JUGAR',cx,528,'bold 20px ui-monospace,Consolas,monospace','#c6ff86','center',18);
label('RÉCORD  '+String(hiScore).padStart(6,'0'),cx,92,'bold 14px ui-monospace,Consolas,monospace','#b58ad8','center',10);
panel(318,296,144,142);
label('RÉCORDS',390,318,'bold 13px ui-monospace,Consolas,monospace','#9ffcff','center',10);
if(!scores.length)label('sin datos',390,352,'bold 12px ui-monospace,Consolas,monospace','#54787a','center',4);
for(let i=0;i<scores.length;i++){const yy=344+i*19;
label((i+1)+'.',330,yy,'bold 12px ui-monospace,Consolas,monospace','#6fb7c4','left',5);
label(String(scores[i]).padStart(6,'0'),452,yy,'bold 12px ui-monospace,Consolas,monospace',i===0?'#ffd166':'#cfefff','right',i===0?9:6);}
label('P / ESC PAUSA   ·   M SONIDO   ·   C CRT   ·   EN MÓVIL: ARRASTRA Y TOCA',cx,560,'bold 11px ui-monospace,Consolas,monospace','#54787a','center',5);
overlayEffects();
}
function drawOver(){
ctx.save();ctx.fillStyle='rgba(4,8,12,.72)';ctx.fillRect(0,0,W,H);ctx.restore();
panel(W/2-160,H/2-110,320,200,'#ff4d6d');
glowText('GAME OVER',W/2,H/2-52,'bold 38px ui-monospace,Consolas,monospace','#ff6b8a','center',24);
label('PUNTUACIÓN  '+String(score).padStart(6,'0'),W/2,H/2+2,'bold 17px ui-monospace,Consolas,monospace','#9ffcff','center',10);
label('RÉCORD  '+String(hiScore).padStart(6,'0'),W/2,H/2+30,'bold 17px ui-monospace,Consolas,monospace','#e0b3ff','center',10);
if(Math.floor(T*2)%2===0)label('PULSA ENTER · RONDA '+(round+1),W/2,H/2+72,'bold 16px ui-monospace,Consolas,monospace','#c6ff86','center',14);
}
function drawPause(){
ctx.save();ctx.fillStyle='rgba(4,8,12,.55)';ctx.fillRect(0,0,W,H);ctx.restore();
panel(W/2-110,H/2-50,220,100,'#9ffcff');
glowText('PAUSA',W/2,H/2,'bold 30px ui-monospace,Consolas,monospace','#9ffcff','center',20);
label('PULSA P PARA SEGUIR',W/2,H/2+34,'bold 13px ui-monospace,Consolas,monospace','#8ad8a4','center',8);
}
function overlayEffects(){
if(crt){ctx.save();ctx.globalAlpha=.5;ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);ctx.restore();}
ctx.drawImage(vig,0,0);
}
/* ================= bucle ================= */
resetRound(1);score=0;mode='title';
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
